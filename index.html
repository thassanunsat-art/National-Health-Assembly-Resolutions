<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดมติสมัชชาสุขภาพแห่งชาติ · NHA Resolutions Dashboard</title>
<meta name="description" content="แดชบอร์ดติดตามการขับเคลื่อนมติสมัชชาสุขภาพแห่งชาติ พ.ศ. 2551–2568 · Interactive dashboard tracking National Health Assembly resolutions.">
<link rel="icon" type="image/png" href="assets/nhco-mark-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="shell">

  <!-- ═══════════════════════ SIDE NAVIGATION ═══════════════════════ -->
  <div class="nav-scrim" id="navScrim" hidden></div>

  <aside class="sidenav" id="sidenav">
    <div class="sidenav-brand">
      <img class="brand-mark" src="assets/nhco-mark-180.png" width="180" height="166"
           data-i18n-alt="brand.alt" alt="ตราสัญลักษณ์สำนักงานคณะกรรมการสุขภาพแห่งชาติ (สช.)">
      <div class="brand-text">
        <strong data-i18n="brand.rail">มติสมัชชาสุขภาพแห่งชาติ</strong>
        <span data-i18n="brand.railSub">สำนักงานคณะกรรมการสุขภาพแห่งชาติ (สช.)</span>
      </div>
      <button class="nav-close" id="navClose" type="button" data-i18n-label="nav.close" aria-label="ปิดเมนู">×</button>
    </div>

    <nav class="sidenav-nav" role="tablist" data-i18n-label="views" aria-label="มุมมอง">
      <p class="sidenav-label" data-i18n="nav.section">มุมมองข้อมูล</p>

      <button role="tab" class="tab is-active" data-view="overview" aria-selected="true">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13h5v8H3zM9.5 3h5v18h-5zM16 9h5v12h-5z"/>
          </svg>
        </span>
        <span class="tab-body">
          <span class="tab-name" data-i18n="tab.overview">ภาพรวม</span>
          <span class="tab-desc" data-i18n="nav.overview.d">สถานะและแนวโน้มรายปี</span>
        </span>
        <span class="tab-count" id="navCountOverview"></span>
      </button>

      <button role="tab" class="tab" data-view="groups" aria-selected="false">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
          </svg>
        </span>
        <span class="tab-body">
          <span class="tab-name" data-i18n="tab.groups">กลุ่มมติ &amp; ประเด็น</span>
          <span class="tab-desc" data-i18n="nav.groups.d">จำแนกตามกลุ่มและประเภทงาน</span>
        </span>
        <span class="tab-count" id="navCountGroups"></span>
      </button>

      <button role="tab" class="tab" data-view="orgs" aria-selected="false">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/>
            <circle cx="10" cy="7.5" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4M15.5 4.2a3.5 3.5 0 0 1 0 6.6"/>
          </svg>
        </span>
        <span class="tab-body">
          <span class="tab-name" data-i18n="tab.orgs">หน่วยงานขับเคลื่อน</span>
          <span class="tab-desc" data-i18n="nav.orgs.d">ใครขับเคลื่อนมติบ้าง</span>
        </span>
        <span class="tab-count" id="navCountOrgs"></span>
      </button>

      <button role="tab" class="tab" data-view="cabinet" aria-selected="false">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16M5 20V9.5l7-4.5 7 4.5V20M9.5 20v-5h5v5"/>
          </svg>
        </span>
        <span class="tab-body">
          <span class="tab-name" data-i18n="tab.cabinet">มติ ครม.</span>
          <span class="tab-desc" data-i18n="nav.cabinet.d">การเสนอเข้าคณะรัฐมนตรี</span>
        </span>
        <span class="tab-count" id="navCountCabinet"></span>
      </button>
    </nav>

    <div class="sidenav-foot">
      <p class="sidenav-label" data-i18n="nav.settings">การแสดงผล</p>
      <div class="sidenav-controls">
        <div class="lang-switch" role="group" data-i18n-label="lang.toggle" aria-label="เลือกภาษา">
          <button type="button" data-lang="th" class="is-on">ไทย</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle" type="button" data-i18n-label="theme.toggle" aria-label="สลับโหมดสว่าง/มืด">
          <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
      <p class="stamp" id="stamp"></p>
    </div>
  </aside>

  <!-- ═══════════════════════ MAIN COLUMN ═══════════════════════ -->
  <div class="main-col">

    <header class="page-head">
      <button class="icon-btn nav-open" id="navOpen" type="button" data-i18n-label="nav.menu" aria-label="เปิดเมนู">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="page-title">
        <h1 id="pageTitle"></h1>
        <p id="pageDesc"></p>
      </div>
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filters">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5h18l-7 8v6l-4 2v-8z"/>
        </svg>
        <span data-i18n="f.show">ตัวกรอง</span>
        <span class="filter-badge" id="filterBadge" hidden>0</span>
      </button>
    </header>

    <section class="filters" id="filters" data-i18n-label="filters" aria-label="ตัวกรอง" hidden>
      <div class="filters-inner">
        <label class="field">
          <span data-i18n="f.year">ปี พ.ศ.</span>
          <select id="fYear"></select>
        </label>
        <label class="field field-wide">
          <span data-i18n="f.group">กลุ่มมติ</span>
          <select id="fGroup"></select>
        </label>
        <label class="field">
          <span data-i18n="f.status">สถานะ</span>
          <select id="fStatus"></select>
        </label>
        <label class="field">
          <span data-i18n="f.sector">ภาคส่วน</span>
          <select id="fSector"></select>
        </label>
        <label class="field field-wide">
          <span data-i18n="f.search">ค้นหา</span>
          <input id="fSearch" type="search" data-i18n-ph="f.searchPh" placeholder="ชื่อมติ / หน่วยงาน / รายละเอียด…" autocomplete="off">
        </label>
        <button class="ghost-btn" id="fReset" type="button" data-i18n="f.reset">ล้างตัวกรอง</button>
      </div>
    </section>

    <div class="summary-bar">
      <div class="chips" id="filterChips"></div>
      <span class="filter-count" id="filterCount"></span>
    </div>

    <main id="main">
      <p class="loading" id="loading" data-i18n="loading">กำลังโหลดข้อมูล…</p>

      <!-- ─────────────────────── OVERVIEW ─────────────────────── -->
      <div class="view" id="view-overview" hidden>
        <div class="kpi-row" id="kpiRow"></div>

        <div class="grid grid-2">
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.status">สถานะการขับเคลื่อนมติ</h2>
              <p data-i18n="c.status.d">สัดส่วนมติตามสถานะการขับเคลื่อน ตามตัวกรองปัจจุบัน</p>
            </figcaption>
            <div class="chart" id="chStatus"></div>
          </figure>

          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.year">จำนวนมติรายปี</h2>
              <p data-i18n="c.year.d">มติสมัชชาสุขภาพแห่งชาติ จำแนกตามปี พ.ศ. ที่มีมติ</p>
            </figcaption>
            <div class="chart" id="chYear"></div>
          </figure>
        </div>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.yearStatus">องค์ประกอบสถานะรายปี</h2>
            <p data-i18n="c.yearStatus.d">แต่ละแท่งคือมติของปีนั้น แบ่งตามสถานะการขับเคลื่อน</p>
          </figcaption>
          <div class="chart" id="chYearStatus"></div>
        </figure>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.resTable">ตารางมติทั้งหมด</h2>
            <p data-i18n="c.resTable.d">คลิกแถวเพื่อดูรายละเอียดการขับเคลื่อนและมติ ครม. ที่เกี่ยวข้อง</p>
          </figcaption>
          <div class="table-wrap" id="tblResolutions"></div>
        </figure>
      </div>

      <!-- ─────────────────────── GROUPS ─────────────────────── -->
      <div class="view" id="view-groups" hidden>
        <div class="kpi-row" id="kpiGroups"></div>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.group">มติแยกตามกลุ่มมติ</h2>
            <p data-i18n="c.group.d">จำนวนมติในแต่ละกลุ่ม แบ่งสีตามสถานะการขับเคลื่อน</p>
          </figcaption>
          <div class="chart" id="chGroup"></div>
        </figure>

        <div class="grid grid-2">
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.issue">ประเภทการขับเคลื่อน</h2>
              <p data-i18n="c.issue.d">จำนวนกิจกรรมการขับเคลื่อน จำแนกตามประเภท</p>
            </figcaption>
            <div class="chart" id="chIssue"></div>
          </figure>
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.topRes">ความเข้มข้นการขับเคลื่อนต่อมติ</h2>
              <p data-i18n="c.topRes.d">มติที่มีกิจกรรมขับเคลื่อนมากที่สุด 15 อันดับแรก</p>
            </figcaption>
            <div class="chart" id="chTopRes"></div>
          </figure>
        </div>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.heatGroup">กลุ่มมติ × ประเภทการขับเคลื่อน</h2>
            <p data-i18n="c.heatGroup.d">จำนวนกิจกรรมขับเคลื่อนในแต่ละช่อง สีไล่ระดับตามจำนวน</p>
          </figcaption>
          <div class="chart chart-scroll" id="chHeatGroup"></div>
        </figure>
      </div>

      <!-- ─────────────────────── ORGS ─────────────────────── -->
      <div class="view" id="view-orgs" hidden>
        <div class="kpi-row" id="kpiOrgs"></div>

        <div class="grid grid-2">
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.sector">ภาคส่วนที่ขับเคลื่อน</h2>
              <p data-i18n="c.sector.d">สัดส่วนกิจกรรมขับเคลื่อน จำแนกตามภาคส่วนของหน่วยงาน</p>
            </figcaption>
            <div class="chart" id="chSector"></div>
          </figure>
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.heatSector">ภาคส่วน × ประเภทการขับเคลื่อน</h2>
              <p data-i18n="c.heatSector.d">รูปแบบการทำงานที่แตกต่างกันของแต่ละภาคส่วน</p>
            </figcaption>
            <div class="chart" id="chHeatSector"></div>
          </figure>
        </div>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.topOrg">หน่วยงานขับเคลื่อนสูงสุด</h2>
            <p data-i18n="c.topOrg.d">20 อันดับแรก วัดจากจำนวนกิจกรรมขับเคลื่อนที่บันทึกไว้</p>
          </figcaption>
          <div class="chart" id="chTopOrg"></div>
        </figure>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.orgTable">ทะเบียนหน่วยงาน</h2>
            <p data-i18n="c.orgTable.d">คลิกแถวเพื่อดูรายการกิจกรรมขับเคลื่อนของหน่วยงานนั้น</p>
          </figcaption>
          <div class="table-wrap" id="tblOrgs"></div>
        </figure>
      </div>

      <!-- ─────────────────────── CABINET ─────────────────────── -->
      <div class="view" id="view-cabinet" hidden>
        <div class="kpi-row" id="kpiCab"></div>

        <div class="grid grid-2">
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.cabStatus">สถานะการเสนอเข้า ครม.</h2>
              <p data-i18n="c.cabStatus.d">มติสมัชชาฯ จำแนกตามสถานะการนำเสนอคณะรัฐมนตรี</p>
            </figcaption>
            <div class="chart" id="chCabStatus"></div>
          </figure>
          <figure class="card">
            <figcaption>
              <h2 data-i18n="c.cabYear">มติ ครม. รายปี</h2>
              <p data-i18n="c.cabYear.d">จำนวนมติคณะรัฐมนตรีที่เกี่ยวข้อง จำแนกตามปี พ.ศ.</p>
            </figcaption>
            <div class="chart" id="chCabYear"></div>
          </figure>
        </div>

        <figure class="card">
          <figcaption>
            <h2 data-i18n="c.timeline">ไทม์ไลน์มติคณะรัฐมนตรี</h2>
            <p data-i18n="c.timeline.d">คลิกเพื่อดูรายละเอียดมติ ครม. และมติสมัชชาฯ ที่เกี่ยวข้อง</p>
          </figcaption>
          <div class="timeline" id="cabTimeline"></div>
        </figure>
      </div>
    </main>

    <footer class="pagefoot">
      <img class="foot-logo" src="assets/nhco-logo.png" width="350" height="454"
           data-i18n-alt="foot.alt" alt="สำนักงานคณะกรรมการสุขภาพแห่งชาติ">
      <div>
        <p id="footMeta"></p>
        <p><span data-i18n="foot.note">สร้างจากชุดข้อมูล</span>
          <code>Name_NHA</code>, <code>driven_NHA</code>, <code>Cabinet-resolution_NHCO</code> ·
          <span data-i18n="foot.static">เว็บไซต์แบบ static ไม่มี backend</span></p>
      </div>
    </footer>
  </div>
</div>

<!-- detail drawer -->
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden data-i18n-label="detail" aria-label="รายละเอียด">
  <button class="drawer-close" id="drawerClose" type="button" data-i18n-label="close" aria-label="ปิด">×</button>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="tooltip" id="tooltip" hidden></div>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
