<style>
/* ==========================================================================
   NHA Resolutions Dashboard — styles
   Palette follows the validated reference instance (light + dark selected
   separately, not an automatic flip).
   ========================================================================== */

:root {
  color-scheme: light;

  --plane:          #f9f9f7;
  --surface:        #fcfcfb;
  --surface-2:      #f2f1ed;
  --text-1:         #0b0b0b;
  --text-2:         #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11, 11, 11, .10);
  --border-strong:  rgba(11, 11, 11, .18);
  --accent:         #2a78d6;
  --accent-soft:    #e8f0fc;

  /* sequential (blue, light → dark) */
  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec;
  --seq-400: #3987e5; --seq-450: #2a78d6; --seq-550: #1c5cab; --seq-650: #104281;

  /* status of resolutions — validated 5-slot categorical set */
  --st-achieved:  #008300;
  --st-ongoing:   #2a78d6;
  --st-revisit:   #eda100;
  --st-mechanism: #4a3aa7;
  --st-endup:     #e34948;

  /* sectors — categorical slots 1,2,3,4,5 */
  --sec-1: #2a78d6; --sec-2: #eb6834; --sec-3: #1baf7a; --sec-4: #eda100; --sec-5: #e87ba4;

  --radius: 14px;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px -16px rgba(11,11,11,.22);
  --font: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:         #0d0d0d;
    --surface:       #1a1a19;
    --surface-2:     #232322;
    --text-1:        #ffffff;
    --text-2:        #c3c2b7;
    --muted:         #898781;
    --grid:          #2c2c2a;
    --axis:          #383835;
    --border:        rgba(255,255,255,.10);
    --border-strong: rgba(255,255,255,.18);
    --accent:        #3987e5;
    --accent-soft:   #17273c;

    --seq-100: #104281; --seq-200: #1c5cab; --seq-300: #256abf;
    --seq-400: #2a78d6; --seq-450: #3987e5; --seq-550: #6da7ec; --seq-650: #9ec5f4;

    --st-achieved:  #008300;
    --st-ongoing:   #3987e5;
    --st-revisit:   #c98500;
    --st-mechanism: #9085e9;
    --st-endup:     #e66767;

    --sec-1: #3987e5; --sec-2: #d95926; --sec-3: #199e70; --sec-4: #c98500; --sec-5: #d55181;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:         #0d0d0d;
  --surface:       #1a1a19;
  --surface-2:     #232322;
  --text-1:        #ffffff;
  --text-2:        #c3c2b7;
  --muted:         #898781;
  --grid:          #2c2c2a;
  --axis:          #383835;
  --border:        rgba(255,255,255,.10);
  --border-strong: rgba(255,255,255,.18);
  --accent:        #3987e5;
  --accent-soft:   #17273c;

  --seq-100: #104281; --seq-200: #1c5cab; --seq-300: #256abf;
  --seq-400: #2a78d6; --seq-450: #3987e5; --seq-550: #6da7ec; --seq-650: #9ec5f4;

  --st-achieved:  #008300;
  --st-ongoing:   #3987e5;
  --st-revisit:   #c98500;
  --st-mechanism: #9085e9;
  --st-endup:     #e66767;

  --sec-1: #3987e5; --sec-2: #d95926; --sec-3: #199e70; --sec-4: #c98500; --sec-5: #d55181;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--plane);
  color: var(--text-1);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ───────────────────────── app shell ───────────────────────── */
.shell { display: flex; align-items: flex-start; min-height: 100vh; }

/* ── side navigation ── */
.sidenav {
  position: sticky; top: 0; z-index: 40; flex: none;
  width: 258px; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--border);
}
.sidenav-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 16px 14px; border-bottom: 1px solid var(--border);
}
/* The NHCO mark is dark purple on white, so it rides on its own white chip
   and stays legible against either theme's surface. */
.brand-mark {
  flex: none; width: auto; height: 34px; border-radius: 8px;
  background: #fff; padding: 3px 4px; box-sizing: content-box;
  box-shadow: 0 0 0 1px var(--border);
}
.brand-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.brand-text strong {
  font-size: 13px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.brand-text span {
  font-size: 10.5px; color: var(--muted); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.nav-close {
  display: none; margin-left: auto; flex: none;
  width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-size: 19px; line-height: 1;
}

.sidenav-nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; }
.sidenav-label {
  margin: 0 0 7px 8px; font-size: 10px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
}

/* Each item is a full row: icon, name, one line of what it holds, a live count. */
.tab {
  display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; cursor: pointer;
  padding: 9px 10px; border: 1px solid transparent; border-radius: 10px;
  background: none; color: var(--text-2); font-family: inherit;
  transition: background .14s, color .14s, border-color .14s;
}
.tab:hover { background: var(--surface-2); color: var(--text-1); }
.tab-ico {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-2); flex: none;
}
.tab-ico svg { width: 17px; height: 17px; }
.tab-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tab-name {
  font-size: 13.5px; font-weight: 600; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab-desc {
  font-size: 11px; color: var(--muted); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab-count {
  font-size: 12px; font-weight: 700; color: var(--muted);
  font-variant-numeric: tabular-nums; padding-left: 2px;
}

.tab.is-active {
  background: var(--accent-soft); border-color: var(--accent);
  color: var(--accent);
}
.tab.is-active .tab-ico { background: var(--accent); color: #fff; }
.tab.is-active .tab-name { font-weight: 700; }
.tab.is-active .tab-desc { color: var(--accent); opacity: .8; }
.tab.is-active .tab-count { color: var(--accent); }

.sidenav-foot { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
.sidenav-controls { display: flex; align-items: center; gap: 8px; }
.stamp { margin: 10px 0 0; font-size: 11px; color: var(--muted); }

.lang-switch {
  display: flex; flex: 1 1 auto; gap: 2px; padding: 2px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
}
.lang-switch button {
  flex: 1 1 0; font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1;
  padding: 7px 8px; border: 0; border-radius: 8px; cursor: pointer;
  background: none; color: var(--text-2); transition: background .15s, color .15s;
}
.lang-switch button:hover { color: var(--text-1); }
.lang-switch button.is-on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text-1); }
.ico-moon { display: none; }
:root[data-theme="dark"] .ico-sun { display: none; }
:root[data-theme="dark"] .ico-moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ico-sun { display: none; }
  :root:not([data-theme="light"]) .ico-moon { display: block; }
}

.nav-scrim { position: fixed; inset: 0; background: rgba(11,11,11,.42); z-index: 39; }
.nav-open { display: none; }

/* ── main column ── */
.main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.page-head, .filters-inner, .summary-bar, main, .pagefoot {
  max-width: 1180px; width: 100%; margin: 0 auto; padding-left: 24px; padding-right: 24px;
}

.page-head {
  display: flex; align-items: center; gap: 14px;
  padding-top: 20px; padding-bottom: 14px;
}
.page-title { min-width: 0; flex: 1 1 auto; }
.page-title h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.page-title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

.filter-toggle {
  display: inline-flex; align-items: center; gap: 7px; flex: none; cursor: pointer;
  font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 9px 13px; min-height: 38px;
}
.filter-toggle:hover { background: var(--surface-2); color: var(--text-1); }
.filter-toggle[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.filter-badge {
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.filter-badge[hidden] { display: none; }

/* ── filters (collapsible) ── */
.filters { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--plane); }
.filters[hidden] { display: none; }
.filters-inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding-top: 14px; padding-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 130px; }
.field-wide { min-width: 210px; flex: 1 1 210px; }
.field > span { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
select, input[type="search"] {
  font-family: inherit; font-size: 13.5px; color: var(--text-1);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 7px 10px; width: 100%; min-height: 36px;
}
select:focus-visible, input:focus-visible, .tab:focus-visible, button:focus-visible, tr:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.ghost-btn {
  font-family: inherit; font-size: 13px; color: var(--text-2); cursor: pointer;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 8px 12px; min-height: 36px; white-space: nowrap;
}
.ghost-btn:hover { background: var(--surface-2); color: var(--text-1); }

/* ── active-filter chips + result count ── */
.summary-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-top: 12px; padding-bottom: 2px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 320px;
  font-size: 12px; font-weight: 500; padding: 4px 6px 4px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent);
}
.chip b { font-weight: 700; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button {
  flex: none; width: 17px; height: 17px; border-radius: 50%; cursor: pointer;
  border: 0; background: transparent; color: inherit;
  font-size: 14px; line-height: 1; display: grid; place-items: center; font-family: inherit;
}
.chip button:hover { background: var(--accent); color: #fff; }
.filter-count { font-size: 12.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }

/* ───────────────────────── layout ───────────────────────── */
main { padding-top: 16px; padding-bottom: 48px; flex: 1 1 auto; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; }
.view { display: flex; flex-direction: column; gap: 16px; }
.view[hidden] { display: none; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); }

.card {
  margin: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 14px;
  min-width: 0;
}
.card figcaption { margin-bottom: 14px; }
.card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.card h2 i { font-style: normal; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.card figcaption p { margin: 0; font-size: 12.5px; color: var(--text-2); }

.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-scroll { overflow-x: auto; }

/* ───────────────────────── KPI tiles ───────────────────────── */
.kpi-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); min-width: 0;
}
.kpi .label { font-size: 11.5px; font-weight: 600; color: var(--text-2); display: block; }
.kpi .label .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: 1px;
}
.kpi .label i { font-style: normal; font-weight: 400; color: var(--muted); }
.kpi .value { font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; margin-top: 4px; }
.kpi .sub { font-size: 11.5px; color: var(--muted); }
.kpi .bar { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 10px; overflow: hidden; }
.kpi .bar > i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

/* ───────────────────────── legend ───────────────────────── */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
.legend button {
  display: flex; align-items: center; gap: 7px; background: none; border: 0; padding: 2px 0;
  font-family: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer;
}
.legend button:hover { color: var(--text-1); }
.legend button[aria-pressed="false"] { opacity: .38; }
.legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend .n { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ───────────────────────── tables ───────────────────────── */
.table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2);
  text-align: left; font-weight: 600; font-size: 11.5px; color: var(--text-2);
  padding: 9px 12px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th .arrow { color: var(--accent); }
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-main { font-weight: 500; color: var(--text-1); }
.cell-sub { font-size: 11.5px; color: var(--muted); display: block; margin-top: 1px; }
.empty { padding: 36px; text-align: center; color: var(--muted); font-size: 13.5px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-size: 11.5px; font-weight: 500; padding: 2px 8px 2px 6px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* ── document links (Google Drive folders from the Word source) ───────── */
.doc-link {
  display: inline-flex; align-items: center; gap: 3px;
  color: var(--accent); text-decoration: none;
  padding: 3px 5px; border-radius: 7px; line-height: 1;
}
.doc-link:hover { background: var(--accent-soft); }
.doc-link .doc-scope {
  font-style: normal; font-size: 10px; font-weight: 700;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.doc-btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; text-decoration: none;
  color: var(--accent); background: var(--accent-soft);
  border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px;
}
.doc-btn:hover { border-color: var(--accent); }

/* ───────────────────────── timeline ───────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 8px; }
/* wide enough for "17 Dec 2567 B.E." on one line in either language */
.tl-item { display: grid; grid-template-columns: 118px 22px 1fr; gap: 0 10px; align-items: start; }
.tl-date { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; padding-top: 14px; text-align: right; }
.tl-rail { position: relative; display: flex; justify-content: center; }
.tl-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--grid); }
.tl-item:first-child .tl-rail::before { top: 18px; }
.tl-item:last-child .tl-rail::before { bottom: calc(100% - 18px); }
.tl-dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 16px; box-shadow: 0 0 0 2px var(--surface); }
.tl-card { padding: 12px 0 14px; min-width: 0; cursor: pointer; }
.tl-card:hover .tl-title { color: var(--accent); }
.tl-title { font-size: 13.5px; font-weight: 600; margin: 0 0 3px; }
.tl-meta { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* ───────────────────────── drawer ───────────────────────── */
.drawer-scrim { position: fixed; inset: 0; background: rgba(11,11,11,.42); z-index: 50; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0 } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 51;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: -20px 0 60px -30px rgba(0,0,0,.5);
  overflow-y: auto; animation: slide .22s cubic-bezier(.22,.8,.3,1);
}
@keyframes slide { from { transform: translateX(28px); opacity: .4 } }
.drawer-close {
  position: sticky; top: 0; float: right; margin: 10px 12px 0 0; z-index: 2;
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); font-size: 20px; line-height: 1; cursor: pointer;
}
.drawer-close:hover { background: var(--surface-2); color: var(--text-1); }
.drawer-body { padding: 22px 24px 40px; }
.drawer-body h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.drawer-body h4 { margin: 24px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.drawer-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.drawer-body p { margin: 0 0 8px; font-size: 13.5px; color: var(--text-2); }
.def { display: grid; grid-template-columns: 116px 1fr; gap: 4px 12px; font-size: 13px; }
.def dt { color: var(--muted); }
.def dd { margin: 0; color: var(--text-1); }
.act {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  background: var(--surface-2);
}
.act-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 5px; }
.act-org { font-size: 13px; font-weight: 600; }
.act p { margin: 0; font-size: 12.5px; color: var(--text-2); white-space: pre-line; }

/* ───────────────────────── tooltip ───────────────────────── */
.tooltip {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--surface); color: var(--text-1);
  border: 1px solid var(--border-strong); border-radius: 9px;
  box-shadow: 0 8px 28px -10px rgba(0,0,0,.35);
  padding: 8px 11px; font-size: 12.5px; max-width: 320px; line-height: 1.45;
}
.tooltip strong { display: block; font-size: 13px; margin-bottom: 2px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 7px; color: var(--text-2); }
.tooltip .tt-row b { color: var(--text-1); font-variant-numeric: tabular-nums; }
.tooltip .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ───────────────────────── svg chart bits ───────────────────────── */
.ax-label { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.ax-value { font-size: 11px; fill: var(--muted); font-family: var(--font); font-variant-numeric: tabular-nums; }
.bar-label { font-size: 11px; fill: var(--text-2); font-family: var(--font); font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.mark { transition: opacity .12s; }
.mark.dim { opacity: .28; }
.hit { fill: transparent; cursor: pointer; }
.hero-num { font-size: 34px; font-weight: 700; fill: var(--text-1); font-family: var(--font); }
.hero-sub { font-size: 12px; fill: var(--muted); font-family: var(--font); }

/* ───────────────────────── footer ───────────────────────── */
.pagefoot {
  padding-top: 22px; padding-bottom: 40px; margin-top: 12px;
  border-top: 1px solid var(--border);
  color: var(--muted); font-size: 12px;
  display: flex; align-items: flex-start; gap: 16px;
}
.pagefoot p { margin: 0 0 4px; }
.foot-logo {
  flex: none; width: auto; height: 96px; border-radius: 6px;
  background: #fff; padding: 5px 7px; box-sizing: content-box;
  box-shadow: 0 0 0 1px var(--border);
}
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

/* ── narrow desktop: keep the rail, drop the descriptions ── */
@media (max-width: 1100px) {
  .sidenav { width: 210px; }
  .tab-desc { display: none; }
  .page-head, .filters-inner, .summary-bar, main, .pagefoot { padding-left: 18px; padding-right: 18px; }
}

/* ── phone / tablet: the rail becomes an off-canvas drawer ── */
@media (max-width: 860px) {
  .sidenav {
    position: fixed; top: 0; left: 0; bottom: 0; height: 100dvh; width: min(290px, 86vw);
    transform: translateX(-102%); transition: transform .22s cubic-bezier(.22,.8,.3,1);
    box-shadow: 18px 0 50px -30px rgba(0,0,0,.5);
  }
  .sidenav.is-open { transform: none; }
  .tab-desc { display: block; }
  .nav-close { display: grid; place-items: center; }
  .nav-open { display: grid; }
  .page-head, .filters-inner, .summary-bar, main, .pagefoot { padding-left: 16px; padding-right: 16px; }
  .page-title h1 { font-size: 18px; }
  .page-title p { display: none; }
  .field, .field-wide { flex: 1 1 calc(50% - 5px); min-width: 0; }
  .ghost-btn { flex: 1 1 100%; }
  .filter-count { margin-left: 0; }
  .pagefoot { flex-direction: column; gap: 12px; }
  .tl-item { grid-template-columns: 76px 18px 1fr; }
  .drawer-body { padding: 18px 16px 36px; }
  .def { grid-template-columns: 96px 1fr; }
}

@media (max-width: 420px) {
  .filter-toggle span:not(.filter-badge) { display: none; }
  .chip { max-width: 190px; }
}

@media print {
  .sidenav, .page-head, .filters, .summary-bar, .drawer, .drawer-scrim, .nav-scrim { display: none !important; }
  .main-col { display: block; }
  .view[hidden] { display: block !important; }
  .card { break-inside: avoid; box-shadow: none; }
}

</style>

   "detail": "คณะรัฐมนตรีรับทราบตามที่คณะกรรมการสุขภาพแห่งชาติ (คสช.) เสนอมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 ซึ่งที่ประชุม คสช. ครั้งที่ 5/2552 เมื่อ 28 ธันวาคม 2552 เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 รวม 11 ประเด็น และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องต่อไป ดังนี้\n 1. การจัดการขยะอันตรายจากชุมชนอย่างมีส่วนร่วมของทุกภาคส่วน\n 2. แผนพัฒนาที่ยั่งยืนบนฐานการพึ่งตนเองด้านเศรษฐกิจ สังคม สิ่งแวดล้อม กรณีภาคใต้\n 3. การพัฒนาระบบบริการปฐมภูมิเพื่อการเข้าถึงบริการสุขภาพที่มีคุณภาพของประชาชน\n 4. ยุติการส่งเสริมการขายยาที่ขาดจริยธรรม : เพื่อลดความสูญเสียทางเศรษฐกิจและสุขภาพของผู้ป่วย\n 5. ยุทธศาสตร์นโยบายแอลกอฮอล์ระดับชาติ\n 6. โรคติดต่ออุบัติใหม่\n 7. การพัฒนาการแพทย์แผนไทย การแพทย์พื้นบ้านและการแพทย์ทางเลือกให้เป็นระบบบริการสุขภาพหลักของประเทศคู่ขนานกับการแพทย์แผนปัจจุบัน\n 8. การจัดการปัญหาภาวะน้ำหนักเกินและโรคอ้วน\n 9. การแก้ไขปัญหาอุบัติเหตุทางถนน\n 10. การพัฒนากลไกการมีส่วนร่วมเพื่อสุขภาวะของเด็ก เยาวชนและครอบครัว\n 11. การพัฒนาระบบการดูแลระยะยาวสำหรับผู้สูงอายุที่อยู่ในภาวะพึ่งพิง",

   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 \n มติ 2 เรื่อง แผนพัฒนาที่ยั่งยืนบนฐานการพึ่งตนเองด้านเเศรษฐกิจสังคม สิ่งแวดล้อม กรณีภาคใต้ \n มติ 4 เรื่อง ยุติการส่งเสริมการขายยาที่ขาดจริยธรรม : เพื่อลดความสูญเสียทางเศรษฐกิจ และสุขภาพของผู้ป่วย \n มติ 5 เรื่อง ยุทธศาสตร์นโยบายแอลกอฮอล์ระดับชาติ \n มติ 8 เรื่อง การจัดการปัญหาภาวะน้ำหนักเกินและโรคอ้วน \nซึ่งคณะกรรมการสุขภาพแห่งชาติ (คสช.) ในการประชุมครั้งที่ 1/2553 เมื่อนที่ 19 กุมภาพันธ์ 2553 เห็นชอบแล้ว และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติในส่วนที่เกี่ยวข้อง ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติ (สช.) เสนอ\n 2. ให้ สช. รับความเห็นและข้อสังเกตของกระทรวงการคลัง กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ กระทรวงมหาดไทย กระทรวงแรงงาน กระทรวงศึกษาธิการ กระทรวงสาธารณสุขกระทรวงอุตสาหกรรม สำนักงบประมาณ และสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องด้วย ดังนี้\n 2.1 มติ 2 ควรเพิ่มนโยบายการสร้างโอกาสทางการศึกษาให้กับเยาวชนภาคใต้ได้สามารถเรียนรู้วิชาชีพที่เชื่อมต่อกับการประกอบอาชีพ พัฒนาทักษะวิชาชีพที่สอดคล้องกับวิถีชีวิตจริงควบคู่ไป การให้ความสำคัญกับการพัฒนาอุตสาหกรรมที่สอดคล้องกับศักยภาพของพื้นที่ตามความต้องการและความจำเป็นของท้องถิ่นโดยไม่กระทบวิถีชีวิตและสุขภาพชุมชนทั้งในระยะสั้นและระยยาว รวมทั้งยึดหลักปรัชญาเศรษฐกิจพอเพียงเป็นแนวปฏิบัติในการเชื่อมโยงวิถีชีวิต เศรษฐกิจ สิ่งแวดล้อม และการเมืองที่มีความสมดุล มั่นคง \nเป็นธรรม ยั่งยืน พร้อมรับการเปลี่ยนแปลงตามหลักของความพอประมาณ\n 2.2 มติ 5 และมติ 8 ควรสนับสนุนให้มีการเรียนรู้หรือกิจกรรมนอกหลักสูตร เพื่อเพิ่มพื้นที่เรียนรู้ในรูปแบบของทักษะชีวิต ทักษะสังคม (Socialization) กิจกรรมที่เน้นการพัฒนาคุณธรรม จริยธรรมความเป็นผู้นำที่ทำให้เยาวชนสามารถเรียนรู้การใช้ชีวิตในสังคมอย่างมีเหตุผล เพื่อเพิ่มทางเลือกของเยาวชน นักศึกษา ในการใช้เวลาว่างให้เกิดประโยชน์และห่างไกลภาวะความเสี่ยงต่าง ๆ ในสังคม\n2.3 ในการจัดทำร่างแผนแม่บทการพัฒนาพื้นที่เศรษฐกิจภาคใต้อย่างยั่งยืนมีความสอดคล้องและให้ความสำคัญตามประเด็น\nในมติสมัชชาสุขภาพแล้ว ทั้งนี้ การทบทวนร่างแผนแม่บทฯ และแผนพัฒนาอื่น ๆ ที่เกี่ยวข้องควรมอบให้คณะกรรมการพัฒนาเขตอุตสาหกรรมเชิงนิเวศน์เป็นผู้ดำเนินการตามมติคณะรัฐมนตรี เมื่อวันที่ 6 ตุลาคม 2552 เนื่องจากมีหน้าที่ในการพิจารณาและกำหนดนโยบาย แผนงาน โครงการและมาตรการในการพัฒนาอุตสาหกรรมภาคการผลิต\nเชิงนิเวศน์ให้สามารถดำรงอยู่ร่วมกับชุมชนได้อย่างยั่งยืนในภาพรวมทั้งระบบ\n2.4 การดำเนินงานตามมติ 5 ควรให้มีการทบทวนมาตรการด้านสุขภาพที่ดำเนินการอยู่ปัจจุบันทั้งระบบ ทั้งนี้ การขับเคลื่อนยุทธศาสตร์ต้องดำเนินการร่วมกันระหว่างหน่วยงานที่เกี่ยวข้องทั้งภาครัฐ เอกชน ชุมชน โดยเฉพาะอย่างยิ่งเครือข่ายประชาคมด้านสุขภาพ โดยคำนึงถึงปัจจัยเสี่ยงตั้งแต่ต้นน้ำจนถึงปลายน้ำเช่น ปัจจัยทางด้านเศรษฐกิจและสังคม สภาพแวดล้อม\n พฤติกรรมสุขภาพ ระบบบริการสุขภาพ เป็นต้น",

   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 \n มติ 2 เรื่อง แผนพัฒนาที่ยั่งยืนบนฐานการพึ่งตนเองด้านเเศรษฐกิจสังคม สิ่งแวดล้อม กรณีภาคใต้ \n มติ 4 เรื่อง ยุติการส่งเสริมการขายยาที่ขาดจริยธรรม : เพื่อลดความสูญเสียทางเศรษฐกิจ และสุขภาพของผู้ป่วย \n มติ 5 เรื่อง ยุทธศาสตร์นโยบายแอลกอฮอล์ระดับชาติ \n มติ 8 เรื่อง การจัดการปัญหาภาวะน้ำหนักเกินและโรคอ้วน \nซึ่งคณะกรรมการสุขภาพแห่งชาติ (คสช.) ในการประชุมครั้งที่ 1/2553 เมื่อนที่ 19 กุมภาพันธ์ 2553 เห็นชอบแล้ว และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติในส่วนที่เกี่ยวข้อง ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติ (สช.) เสนอ\n 2. ให้ สช. รับความเห็นและข้อสังเกตของกระทรวงการคลัง กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ กระทรวงมหาดไทย กระทรวงแรงงาน กระทรวงศึกษาธิการ กระทรวงสาธารณสุขกระทรวงอุตสาหกรรม สำนักงบประมาณ และสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องด้วย ดังนี้\n 2.1 มติ 2 ควรเพิ่มนโยบายการสร้างโอกาสทางการศึกษาให้กับเยาวชนภาคใต้ได้สามารถเรียนรู้วิชาชีพที่เชื่อมต่อกับการประกอบอาชีพ พัฒนาทักษะวิชาชีพที่สอดคล้องกับวิถีชีวิตจริงควบคู่ไป การให้ความสำคัญกับการพัฒนาอุตสาหกรรมที่สอดคล้องกับศักยภาพของพื้นที่ตามความต้องการและความจำเป็นของท้องถิ่นโดยไม่กระทบวิถีชีวิตและสุขภาพชุมชนทั้งในระยะสั้นและระยยาว รวมทั้งยึดหลักปรัชญาเศรษฐกิจพอเพียงเป็นแนวปฏิบัติในการเชื่อมโยงวิถีชีวิต เศรษฐกิจ สิ่งแวดล้อม และการเมืองที่มีความสมดุล มั่นคง \nเป็นธรรม ยั่งยืน พร้อมรับการเปลี่ยนแปลงตามหลักของความพอประมาณ\n 2.2 มติ 5 และมติ 8 ควรสนับสนุนให้มีการเรียนรู้หรือกิจกรรมนอกหลักสูตร เพื่อเพิ่มพื้นที่เรียนรู้ในรูปแบบของทักษะชีวิต ทักษะสังคม (Socialization) กิจกรรมที่เน้นการพัฒนาคุณธรรม จริยธรรมความเป็นผู้นำที่ทำให้เยาวชนสามารถเรียนรู้การใช้ชีวิตในสังคมอย่างมีเหตุผล เพื่อเพิ่มทางเลือกของเยาวชน นักศึกษา ในการใช้เวลาว่างให้เกิดประโยชน์และห่างไกลภาวะความเสี่ยงต่าง ๆ ในสังคม\n 2.3 ในการจัดทำร่างแผนแม่บทการพัฒนาพื้นที่เศรษฐกิจภาคใต้อย่างยั่งยืนมีความสอดคล้องและให้ความสำคัญตามประเด็น\nในมติสมัชชาสุขภาพแล้ว ทั้งนี้ การทบทวนร่างแผนแม่บทฯ และแผนพัฒนาอื่น ๆ ที่เกี่ยวข้องควรมอบให้คณะกรรมการพัฒนาเขตอุตสาหกรรมเชิงนิเวศน์เป็นผู้ดำเนินการตามมติคณะรัฐมนตรี เมื่อวันที่ 6 ตุลาคม 2552 เนื่องจากมีหน้าที่ในการพิจารณาและกำหนดนโยบาย แผนงาน โครงการและมาตรการในการพัฒนาอุตสาหกรรมภาคการผลิตเชิงนิเวศน์ให้สามารถดำรงอยู่ร่วมกับชุมชนได้อย่างยั่งยืนในภาพรวมทั้งระบบ\n 2.4 การดำเนินงานตามมติ 5 ควรให้มีการทบทวนมาตรการด้านสุขภาพที่ดำเนินการอยู่ปัจจุบันทั้งระบบ ทั้งนี้ การขับเคลื่อนยุทธศาสตร์ต้องดำเนินการร่วมกันระหว่างหน่วยงานที่เกี่ยวข้องทั้งภาครัฐ เอกชน ชุมชน โดยเฉพาะอย่างยิ่งเครือข่ายประชาคมด้านสุขภาพ โดยคำนึงถึงปัจจัยเสี่ยงตั้งแต่ต้นน้ำจนถึงปลายน้ำเช่น ปัจจัยทางด้านเศรษฐกิจและสังคม สภาพแวดล้อมพฤติกรรมสุขภาพ ระบบบริการสุขภาพ เป็นต้น",

   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 มติ 9การแก้ไขปัญหาอุบัติเหตุทางถนน ซึ่งคณะกรรมการสุขภาพแห่งชาติ (คสช.) ในการประชุมครั้งที่ 2/2553 เมื่อวันที่ 23 เมษายน 2553 เห็นชอบแล้ว และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติในส่วนเกี่ยวข้องต่อไป ตามที่สำนักงาน คสช. เสนอ\n 2. ให้สำนักงาน คสช. รับความเห็นของกระทรวงการคลัง กระทรวงพาณิชย์ และกระทรวงศึกษาธิการโดยในส่วนของกระทรวงการคลัง มีความเห็นเกี่ยวกับการจัดเก็บภาษีสรรพสามิตรถจักรยานยนต์ โดยกำหนดอัตราภาษีตามลักษณะเครื่องยนต์ที่เป็นมิตรต่อสิ่งแวดล้อมหากต้องการปรับอัตราภาษีสรรพสามิตรถจักรยานยนต์ตามขนาดเครื่องยนต์เพื่อลดปริมาณรถจักรยานยนต์ในถนนในการลดอุบัติเหตุตามที่สมัชชาสุขภาพแห่งชาติเสนอ ควรพิจารณาถึงเหตุผลการกำหนดอัตราภาษีตามขนาดเครื่องยนต์ว่ามีความสัมพันธ์กับอุบัติเหตุที่เกิดขึ้นในถนนอย่างไร รวมทั้งพิจารณาถึงผลกระทบต่ออุตสาหกรรมการผลิตรถจักรยานยนต์ของประเทศ จากการปรับเพิ่มอัตราภาษีสรรพสามิตรถจักรยานยนต์ดังกล่าว ไปพิจารณาประกอบการดำเนินการในส่วนที่เกี่ยวข้องด้วย",

   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 มติที่ 6 โรคติดต่ออุบัติใหม่ ซึ่งคณะกรรมการสุขภาพแห่งชาติ (คสช.) ในการประชุมครั้งที่ 3/2553 เมื่อวันที่ 18 มิถุนายน 2553 พิจารณาเห็นชอบให้คณะกรรมการอำนวยการเตรียมความพร้อม ป้องกันควบคุม และแก้ไขสถานการณ์โรคไข้หวัดนก ไข้หวัดใหญ่ระบาดใหญ่ และโรคระบาดร้ายแรงในมนุษย์ เป็นกลไกดำเนินการตามมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 2 พ.ศ. 2552 โดยให้คณะกรรมการอำนวยการเตรียมความพร้อมฯ นำมติสมัชชาสุขภาพแห่งชาติไปประกอบการพิจารณาดำเนินการทั้งเรื่ององค์ประกอบของคณะกรรมการ บทบาทการจัดทำแผนยุทธศาสตร์ เพื่อการบริหารจัดการโรคติดต่ออุบัติใหม่แบบบูรณาการภายในระยะเวลา 1 ปี และการจัดทำข้อเสนอจัดตั้งกลไกระดับชาติเพื่อจัดการปัญหาโรคติดต่ออุบัติใหม่ที่มีความต่อเนื่อง มีประสิทธิภาพและมีส่วนร่วมต่อไป และให้หน่วยงานที่เกี่ยวข้องดำเนินการตามมติที่เกี่ยวข้องต่อไป ตามที่สำนักงาน คสช. เสนอ\n 2. ให้คณะกรรมการอำนวยการเตรียมความพร้อมฯ กระทรวงสาธารณสุข และหน่วยงานอื่นที่เกี่ยวข้องรับความเห็นของกระทรวงคมนาคม กระทรวงวิทยาศาสตร์และเทคโนโลยี และสำนักงานปลัดสำนักนายกรัฐมนตรี ที่เห็นควรเพิ่มเติมองค์ประกอบของคณะกรรมการอำนวยการเตรียมความพร้อมฯ ในส่วนของผู้แทนองค์กรปกครองส่วนท้องถิ่น ผู้แทนภาคประชาสังคม และผู้แทนสื่อมวลชน ทั้งนี้ เพื่อให้สามารถกำหนดแนวทางแก้ไขปัญหาไปสู่การปฏิบัติได้รวดเร็ว สามารถหยุดยั้งปัญหาไม่ให้ลุกลามบานปลายได้อย่างมีประสิทธิภาพ ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องด้วย",

  {

   "title": "3.7 ร่วมฝ่าวิกฤตความไม่เป็นธรรม นำสังคมสู่สุขภาวะ",
   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 เรื่อง ร่วมฝ่าวิกฤตความไม่เป็นธรรม นำสังคมสู่สุขภาวะ และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติสมัชชาสุขภาพแห่งชาติฯ ต่อไป ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ โดยมติสมัชชาสุขภาพแห่งชาติฯ มี ดังนี้\n1.1 ให้รัฐบาล คณะกรรมการปฏิรูป (คปร.) และคณะกรรมการสมัชชาปฏิรูป (คสป.) นำแนวทางการขับเคลื่อนการปฏิรูปประเทศไทยที่จะลดความเหลื่อมล้ำและเพิ่มความเป็นธรรม นำไปสู่สังคมสุขภาวะ ในประเด็นการปฏิรูปด้านเศรษฐกิจ การจัดการทรัพยากร สังคมและสุขภาวะประชาธิปไตยและการเมือง การศึกษา และสื่อทุกประเภทในทุกระดับ\n1.2 ให้รัฐบาลเร่งรัดการดำเนินการตามรัฐธรรมนูญแห่งราชอาณาจักรไทย มาตรา 87 (1) ที่ส่งเสริมให้ประชาชนมีส่วนร่วมในการกำหนดนโยบายทั้งในระดับชาติ และระดับท้องถิ่น โดยให้มีการปฏิรูปกระบวนการนโยบายสาธารณะเพื่อสร้างความเป็นธรรม และลดความเหลื่อมล้ำในสังคมและมีการดำเนินงานที่เร่งด่วน ดังนี้\n 1.2.1 ให้มีภาคีเครือข่ายประชาชน และองค์กรที่เกี่ยวข้องจัดทำให้เกิดกระบวนการนโยบายสาธารณะที่เป็นธรรม ตระหนักถึงคุณค่าของการอยู่ร่วมกัน\n 1.2.2 ให้มีการกำหนดกรอบและกติการ่วมในการกำหนดนโยบายสาธารณะและการจัดทำแผนพัฒนาเศรษฐกิจและสังคมแห่งชาติที่ให้ความสำคัญกับประเด็นการปฏิรูป\n 1.2.3 พัฒนากลไกเพื่อการปฏิรูประบบการวิจัยแห่งชาติและระบบการสร้างปัญญาสาธารณะ\n 1.2.4 สนับสนุนและส่งเสริมให้มีการพัฒนาสมรรถนะของสังคมและระดับการมีส่วนร่วมในการติดตามให้ความเห็นอย่างจริงจังในกลไกพหุภาคีและเครื่องมือที่มีอยู่ในการจัดการความขัดแย้งที่เกิดจากนโยบายของรัฐ\n1.2.5 จัดให้มีกลไกการจัดการความไม่เป็นธรรม ในระดับชาติ ระดับภูมิภาค หรือกลุ่มจังหวัด ระดับจังหวัด และระดับท้องถิ่น\n2. ให้สำนักงานคณะกรรมการสุขภาพแห่งชาติรับความเห็นของสำนักงานปลัดสำนักนายกรัฐมนตรี สำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติเกี่ยวกับการกำหนดหน่วยงานที่รับผิดชอบให้ชัดเจนเพื่อจัดทำรายละเอียดในแต่ละประเด็นตามแนวทางการขับเคลื่อนการปฏิรูปประเทศไทยให้เป็นรูปธรรมอย่างแท้จริง การนำมติไปสู่การปฏิบัติควรจัดลำดับความสำคัญและทำการศึกษาให้ชัดเจนก่อนกำหนดแนวทางและมาตรการที่จะดำเนินการ การกำหนดแนวทางการติดตามประเมินผลควรคำนึงถึงความเชื่อมโยงและการบูรณาการการทำงานร่วมกับภาคส่วนที่มีการดำเนินงานสอดคล้องกัน รวมทั้งการเปิดเผยข้อมูลที่เกี่ยวข้องทั้งข้อมูลที่เป็นมติ รายงานการประชุมคณะกรรมการคณะอนุกรรมการด้านต่าง ๆ ผลการดำเนินงานที่มีผลกระทบต่อสาธารณชน และความเห็นของกระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อมในประเด็นการให้มีการจำกัดสิทธิการถือครองที่ดิน เน้นการส่งเสริมการใช้ที่ดินให้เหมาะสมกับสมรรถนะของดินและภูมินิเวศ ไปพิจารณาดำเนินการด้วย",

  {

   "title": "3.1 มาตรการทำให้สังคมไทยไร้แร่ใยหิน",
   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 มติ 1 มาตรการทำให้สังคมไทยไร้แร่ใยหิน ตามมติการประชุมคณะกรรมการสุขภาพแห่งชาติ ครั้งที่ 1/2554 วันที่ 25กุมภาพันธ์ 2554 และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติต่อไป ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ ทั้งนี้ ให้กระทรวงการคลัง กระทรวงทรัพยากร ธรรมชาติและสิ่งแวดล้อม และหน่วยงานที่เกี่ยวข้องรับความเห็นของกระทรวงวิทยาศาสตร์และเทคโนโลยีและสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ ที่เห็นควรมีการบริหารจัดการการฟุ้งกระจายของแร่ใยหินในวัสดุต่าง ๆ ที่หมดอายุการใช้งานในชุมชน และส่งเสริมให้มีการวิจัยเพื่อผลิตผลงานผลิตภัณฑ์ทางเลือกทดแทนการใช้แร่ใยหินในประเทศไทย\n นอกจากนี้ ให้หน่วยงานที่รับผิดชอบเร่งหารือและแลกเปลี่ยนข้อมูลผลกระทบกับผู้ประกอบการ เพื่อกำหนดมาตรการบรรเทาผลกระทบให้กับผู้ประกอบการและผู้บริโภค โดยให้มี ผู้ที่ไม่มีส่วนได้ส่วนเสียโดยตรง (Third party) เข้าร่วมการหารือด้วยรวมทั้งให้กระทรวง การคลังและกระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อมไปพิจารณาร่วมกันถึงความเหมาะสมในส่วนของการจัดตั้งกองทุนช่วยเหลือผู้ได้รับผลกระทบจากแร่ใยหิน ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องด้วย\n 2. เห็นชอบแนวทางการบริหารจัดการความเป็นอันตรายของแร่ใยหินไครโซไทล์ แนวทางที่ 2 ห้ามนำเข้าแร่ใยหินไครโซไทล์ และผลิตภัณฑ์ที่มีส่วนประกอบของแร่ใยหินไครโซไทล์เฉพาะกรณี และห้ามผลิตผลิตภัณฑ์ที่มีส่วนประกอบของแร่ใยหินไครโซไทล์ ที่ใช้วัตถุดิบอื่นหรือใช้ผลิตภัณฑ์อื่นทดแทนได้ โดยใช้อำนาจตามกฎหมายว่าด้วยวัตถุอันตราย กฎหมายว่าด้วยการส่งออกไปนอกและการนำเข้ามาในราชอาณาจักรซึ่งสินค้า กฎหมายว่าด้วยโรงงานและกฎหมายว่าด้วยมาตรฐานผลิตภัณฑ์อุตสาหกรรม ตามความเห็นของกระทรวงอุตสาหกรรม\n 3. ให้กระทรวงอุตสาหกรรมรับไปจัดทำแผนในการยกเลิกการนำเข้า ผลิต และจำหน่ายแร่ใยหินและผลิตภัณฑ์ที่มีแร่ใยหินเป็นส่วนประกอบทุกชนิด ทั้งนี้ ให้กำหนดกรอบเวลาที่ชัดเจนในการดำเนินการตามแผนด้วย แล้วนำเสนอคณะรัฐมนตรีพิจารณาต่อไป\n 4. ให้กระทรวงการคลังรับไปตรวจสอบว่า สาเหตุที่สินค้าที่ใช้วัตถุดิบอื่นเป็นส่วนประกอบแทนแร่ใยหินมีราคาสูงขึ้นเนื่องมาจากต้นทุนหรือการเพิ่มอัตราภาษี\n5. ให้กระทรวงสาธารณสุขรับไปศึกษาผลกระทบของแร่ใยหินที่มีต่อสุขภาพของผู้ใช้แรงงานที่ทำงานสัมผัสแร่ใยหินและผู้บริโภคที่ใช้ผลิตภัณฑ์ที่มีส่วนประกอบของแร่ใยหินโดยให้จัดลำดับความสำคัญเพื่อจะได้กำหนดมาตรการในการป้องกันผู้ได้รับผลกระทบได้อย่างมีประสิทธิภาพ",

   "title": "3.3 การควบคุมกลยุทธ์การตลาดอาหารสำหรับทารกและเด็กเล็ก",
   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 มติ 3 การควบคุมกลยุทธ์การตลาดอาหารสำหรับทารกและเด็กเล็ก ตามมติการประชุมคณะกรรมการสุขภาพแห่งชาติ ครั้งที่ 1/2554 วันที่ 25 กุมภาพันธ์ 2554 และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติต่อไป ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ สรุปได้ ดังนี้\n1.1 ให้กระทรวงสาธารณสุขเป็นหน่วยงานหลักดำเนินการ ดังนี้\n 1.1.1 ควบคุมการตลาดอาหารสำหรับทารกและเด็กเล็ก ตามหลักเกณฑ์ว่าด้วยการตลาดอาหารสำหรับทารกและเด็กเล็กและผลิตภัณฑ์ที่เกี่ยวข้อง พ.ศ. 2551\n 1.1.2 พัฒนาและผลักดันร่างพระราชบัญญัติการตลาดอาหารทารกและเด็กเล็ก พ.ศ. .... ให้สำเร็จในปี พ.ศ. 2555 โดยจัดให้มีกลไกดำเนินการและใช้หลักเกณฑ์ว่าด้วยการตลาดอาหารสำหรับทารกและเด็กเล็กและผลิตภัณฑ์ที่เกี่ยวข้อง พ.ศ. 2551 เป็นหลักเกณฑ์พื้นฐานขั้นต่ำ และให้มีการจัดตั้งกองทุนสนับสนุนการเลี้ยงลูกด้วยนมแม่ โดยพิจารณาทุนการดำเนินงานจากเงินภาษีการนำเข้าหรือรายได้จากการจำหน่ายผลิตภัณฑ์นมผสมจากต่างประเทศในลักษณะเดียวกับกองทุนสนับสนุนการสร้างเสริมสุขภาพ\n 1.1.3 พัฒนากลไกการปฏิบัติ ระบบการติดตามประเมินผลและระบบรายงานผลโดยการมีส่วนร่วมของทุกภาคส่วน ทั้งระดับท้องถิ่น จังหวัด ประเทศ และองค์กรระหว่างประเทศ\n 1.2 ให้กระทรวงสาธารณสุขเป็นหน่วยงานหลักร่วมกับกระทรวงแรงงาน สำนักนายกรัฐมนตรี กรมบัญชีกลาง และทุกภาคส่วนที่เกี่ยวข้องศึกษาเพื่อพิจารณาความเป็นไปได้ในการขยายสิทธิการลาคลอด และพิจารณาปรับปรุงกฎหมายเกี่ยวกับสิทธิการลาคลอด รวมถึงการได้รับค่าจ้างระหว่างลา ในกรณีที่เลี้ยงลูกด้วยนมแม่ และให้จัดมาตรการหรือสวัสดิการในการส่งเสริมและสนับสนุนการเลี้ยงลูกด้วยนมแม่แก่สตรีที่คลอดบุตรและอยู่ระหว่างการให้นมบุตรในสถานประกอบกิจการและสถานที่ทำงาน รวมทั้งพิจารณามาตรการการลดหย่อนภาษีและการประกาศเกียรติคุณให้แก่สถานประกอบกิจการที่เป็นแบบอย่างของการส่งเสริมการเลี้ยงลูกด้วยนมแม่\n2. ให้สำนักงานคณะกรรมการสุขภาพแห่งชาติรับความเห็นของกระทรวงการคลังที่เห็นว่าการขยายสิทธิการลาคลอดให้เป็น 180 วัน มีผลกระทบต่อกฎหมายหลายฉบับ และอาจมีผลกระทบโดยตรงต่อแรงงานสตรี ซึ่งอาจถูกกีดกันโดยเฉพาะภาคเอกชน เป็นการลดโอกาสในการทำงาน ซึ่งเป็นประเด็นปัญหาที่จำเป็นอย่างยิ่งที่หน่วยงานที่เกี่ยวข้องควรที่จะกำหนดมาตรการเพื่อป้องกันปัญหาดังกล่าว เพื่อให้การขยายสิทธิลาคลอดเกิดผลในทางปฏิบัติได้จริง ไปประกอบการพิจารณาด้วย",

  {

   "title": "3.4 นโยบายการเป็นศูนย์กลางสุขภาพนานาชาติ",
   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 มติ 4 นโยบายการเป็นศูนย์กลางสุขภาพนานาชาติ ตามมติการประชุมคณะกรรมการสุขภาพแห่งชาติ ครั้งที่ 1/2554 และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติต่อไป ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ สรุปได้ ดังนี้\n 1.1 ให้กระทรวงสาธารณสุข กระทรวงศึกษาธิการ และหน่วยงานที่เกี่ยวข้อง รวมทั้งภาคเอกชน และภาคประชาชน สนับสนุนข้อมูลแก่คณะกรรมการสนับสนุนนโยบายสุขภาพเพื่อสนับสนุนการศึกษาในประเด็นผลกระทบทั้งด้านบวก และด้านลบจากการเป็นศูนย์กลางสุขภาพนานาชาติ รวมทั้งความเป็นไปได้ในการใช้ศูนย์กลางสุขภาพนานาชาติและแนวทางให้ภาคเอกชนที่ดำเนินการนโยบายนี้คืนกำไรให้กับสังคมโดยยึดหลักความเป็นธรรมต่อทุกภาคส่วน\n 1.2 ให้คณะกรรมการส่งเสริมการลงทุนพิจารณาดำเนินการตามธรรมนูญว่าด้วยระบบสุขภาพแห่งชาติ พ.ศ. 2552 ข้อ 51 โดยไม่พึงให้การสนับสนุนหรือสิทธิพิเศษทางภาษีและการลงทุนกับบริการสาธารณสุขที่มุ่งเน้นผลประโยชน์เชิงธุรกิจ\n 1.3 ให้โรงพยาบาลรัฐ รวมถึงโรงพยาบาลมหาวิทยาลัยต่าง ๆ ส่งเสริมการเข้าร่วมเป็นศูนย์กลางสุขภาพนานาชาติด้านขีดความสามารถทางวิชาการทางการแพทย์ โดยให้มีระบบการติดตามและประเมินผลกระทบที่จะเกิดกับระบบสาธารณสุขไทย และให้สร้างหลักประกันการเข้าถึงการรักษาพยาบาลที่มีคุณภาพของประชาชนไทย\n 1.4 ให้สถาบันวิจัยระบบสาธารณสุขเป็นหน่วยงานหลักร่วมกับกระทรวงสาธารณสุข โรงเรียนแพทย์ สำนักอนามัยกรุงเทพมหานครและหน่วยงานที่เกี่ยวข้องสนับสนุนการจัดตั้งศูนย์ข้อมูลที่มีศักยภาพในการจัดการข้อมูลและให้ความรู้แก่ประชาชนเกี่ยวกับคุณภาพการบริการรักษา พยาบาล และสาธารณสุข เพื่อป้องกันผลกระทบจากธุรกิจจากการแพทย์ และลดผลกระทบด้านลบจากการเป็นศูนย์กลางสุขภาพนานาชาติ\n1.5 ให้กระทรวงสาธารณสุข โดยกรมสนับสนุนบริการสุขภาพร่วมกับหน่วยงานต่าง ๆ ที่เกี่ยวข้อง และคณะกรรมการเฉพาะกิจของนายกรัฐมนตรีเพื่อพัฒนาประเทศไทยเป็นศูนย์กลางสุขภาพนานาชาติที่ไม่กระทบต่อบริการสุขภาพสำหรับประชาชน และพัฒนากลไกการมีส่วนร่วมของภาคประชาชน ภาคเอกชน และหน่วยงานที่เกี่ยวข้องในการกำหนดและพัฒนานโยบายดังกล่าวทั้งนโยบายระดับชาติและแผนปฏิบัติการเพื่อลดผลกระทบในทางลบต่อการพัฒนาระบบบริการสุขภาพสำหรับคนไทย\n1.6 ให้คณะกรรมการกำลังคนด้านสุขภาพแห่งชาติเป็นกลไกหลักร่วมกับกระทรวงสาธารณสุข กระทรวงศึกษาธิการ และหน่วยงานที่เกี่ยวข้อง รวมถึงภาคเอกชนดำเนินการ ดังนี้\n1.6.1 ร่วมกับคณะกรรมการสนับสนุนการศึกษาและติดตามการเจรจาการค้าระหว่างประเทศที่มีผลกระทบต่อสุขภาพและนโยบายสุขภาพ จัดทำแผนการผลิต การจัดการและมาตรการธำรงรักษาบุคลากรทางการแพทย์ และสาธารณสุขให้เหมาะสมเพื่อทดแทนการสูญเสียบุคลากรจากผลกระทบที่เกิดขึ้นจากนโยบายการเป็นศูนย์กลางสุขภาพนานาชาติ\n1.6.2 สนับสนุนการพัฒนาระบบข้อมูล และอำนวยความสะดวกในการเข้าถึงข้อมูลที่จำเป็น เพื่อการกำกับติดตามการเคลื่อนย้ายบุคลากรทางการแพทย์และสาธารณสุข จากนโยบายการเป็นศูนย์กลางสุขภาพนานาชาติ\n1.6.3 กำหนดแนวทางให้ความร่วมมือระหว่างภาครัฐและภาคเอกชนในการใช้ทรัพยากรร่วมกันในการผลิตบุคลากรทางการแพทย์และสาธารณสุขโดยเฉพาะสาขาที่ขาดแคลน และสนับสนุนให้เกิดกลไกการแลกเปลี่ยนความรู้ ประสบการณ์ ระหว่างภาครัฐและภาคเอกชนด้านการบริหารงานบุคคลและการดำเนินงานในโรงพยาบาล เพื่อให้มีการนำไปปรับระบบบริการให้เกิดประโยชน์สูงสุดต่อประชาชน\n2. ให้หน่วยงานที่เกี่ยวข้องรับความเห็นของสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติที่เห็นควรเร่งหามาตรการเพิ่มค่าตอบแทนของบุคลากรทางการแพทย์ในภาครัฐ เพื่อลดปัญหาการเคลื่อนย้ายบุคลากรทางการแพทย์จากภาครัฐไปสู่ภาคเอกชน และการกำหนดให้ภาคเอกชนผู้ได้รับผลประโยชน์จากนโยบายการพัฒนาประเทศไทยให้เป็นศูนย์กลางสุขภาพนานาชาติชดเชยผู้ได้รับผลกระทบอย่างเหมาะสม อาทิ การจัดตั้งกองทุนผลิตแพทย์เพิ่มโดยใช้รายได้จากภาษีที่เก็บได้จากการประกอบการของสถานบริการสาธารณสุขในภาคเอกชน เป็นต้น และข้อสังเกตของคณะรัฐมนตรีที่เห็นว่าการแก้ไขปัญหาการขาดแคลนบุคลากรทางการแพทย์ในสาขาที่ขาดแคลน อาจพิจารณาเปิดโอกาสให้แพทย์จากต่างประเทศเข้ามาทดแทนหรือสนับสนุนให้มหาวิทยาลัยของภาคเอกชนที่มีความพร้อมในการเปิดสอนสาขาทางด้านการแพทย์เพื่อผลิตบุคลากรทางการแพทย์เพิ่มขึ้น ไปประกอบการพิจารณาดำเนินการต่อไปด้วย",

   "detail": "1. ให้คณะกรรมการพัฒนาอนามัยการเจริญพันธุ์แห่งชาติร่วมกับคณะกรรมการคุ้มครองเด็กแห่งชาติ คณะกรรมการส่งเสริมการพัฒนาเด็กและเยาวชนแห่งชาติ และภาคีเครือข่ายที่เกี่ยวข้องร่วมกันพิจารณาจัดตั้งกลไกร่วมในการดำเนินการแปลงนโยบายและยุทธศาสตร์การพัฒนาอนามัยการเจริญพันธุ์แห่งชาติ และยุทธศาสตร์ป้องกันและแก้ไขปัญหาเด็กและเยาวชนตั้งครรภ์ไม่พร้อมสู่แผนการปฏิบัติงานที่ชัดเจน ครอบคลุมทุกระดับ รวมทั้งจัดทำมาตรการเร่งด่วนในการจัดการปัญหาการตั้งครรภ์ในวัยรุ่นแบบบูรณาการภายในปี พ.ศ. 2554\n2. ให้กระทรวงศึกษาธิการและหน่วยงานที่มีสถานศึกษาในสังกัดร่วมกับองค์กรภาครัฐ องค์กรปกครองส่วนท้องถิ่น ภาควิชาการ และภาคประชาสังคม ดำเนินงานพัฒนาการเรียนการสอนเพศศึกษา (sexuality education) จริยธรรมและศีลธรรม และจัดให้มีระบบรองรับการแก้ปัญหานักเรียน นักศึกษาที่ตั้งครรภ์ในระหว่างการศึกษา โดยจัดให้มีกระบวนการเรียนการสอนเพศศึกษารอบด้านที่มีคุณภาพอย่างทั่วถึงทั้งการศึกษาในระบบและนอกระบบ โดยเริ่มตั้งแต่ปฐมวัย และให้สถานศึกษาปรับกระบวนการเรียนการสอนสำหรับนักเรียน นักศึกษาที่ตั้งครรภ์ให้มีความยืดหยุ่น เพื่อให้โอกาสนักเรียน นักศึกษาที่ตั้งครรภ์ได้รับการศึกษาจนจบหลักสูตรโดยไม่เป็นอุปสรรคต่อการตั้งครรภ์ รวมทั้งให้สถานศึกษาร่วมกับหน่วยงานและองค์กรที่เกี่ยวข้องรับผิดชอบในการให้ความช่วยเหลือในรูปแบบที่หลากหลายโดยคำนึงถึงสิทธิประโยชน์และการมีส่วนร่วมของเด็กและเยาวชนเป็นสำคัญ",

  {

   "title": "3.2 ความเป็นธรรมในการเข้าถึงบริการสุขภาพของคนพิการ",
   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 มติ 2 ความเป็นธรรมในการเข้าถึงบริการสุขภาพของคนพิการ และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติที่เกี่ยวข้องต่อไป ตามมติคณะกรรมการสุขภาพแห่งชาติ ในการประชุมครั้งที่ 1/2554 เมื่อวันที่ 25 กุมภาพันธ์ 2554 ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ โดยมติสมัชชาสุขภาพแห่งชาติสรุปได้ ดังนี้\n 1.1 ให้คณะกรรมการพัฒนาระบบการเงินการคลังด้านสุขภาพแห่งชาติจัดทำข้อเสนอแนะต่อคณะรัฐมนตรี เพื่อให้สำนักงานหลักประกันสุขภาพแห่งชาติร่วมกับสำนักงานประกันสังคม กรมบัญชีกลาง กระทรวงการคลัง กระทรวงสาธารณสุข พัฒนาระบบการคลังเพื่อการดูแลสุขภาพคนพิการให้มีความเสมอภาค\n 1.2 ให้คณะกรรมการส่งเสริมและพัฒนาคุณภาพชีวิตคนพิการแห่งชาติพิจารณาให้คณะอนุกรรมการส่งเสริมและพัฒนาคุณภาพชีวิตคนพิการประจำจังหวัดและคณะอนุกรรมการส่งเสริมและพัฒนาคุณภาพชีวิตคนพิการกรุงเทพมหานครดำเนินการ ดังนี้\n 1.2.1 บูรณาการประเด็นการพัฒนาสุขภาพคนพิการเข้ากับแผนพัฒนาคุณภาพชีวิตคนพิการประจำจังหวัด โดยให้สอดคล้องกับแผนพัฒนาคุณภาพชีวิตคนพิการแห่งชาติที่ใช้อยู่ในขณะนั้น ให้บรรจุในแผนพัฒนายุทธศาสตร์ระดับจังหวัด โดยเน้นกระบวนการมีส่วนร่วมอย่างมีประสิทธิภาพจากทุกภาคส่วน\n 1.2.2 พิจารณาจัดสรรงบประมาณเพื่อการลงทุนและดำเนินการพัฒนาสุขภาพคนพิการระดับจังหวัดอย่างเป็นระบบ ตามแผนส่งเสริมและพัฒนาคุณภาพชีวิตคนพิการประจำจังหวัด\n 1.2.3 สนับสนุนให้กลไกวิชาการและเครือข่ายองค์กรด้านคนพิการ ศึกษาสาเหตุความพิการและร่วมกันกำกับติดตามการปฏิบัติตามกฎหมายและนโยบายของรัฐบาลในเรื่องที่เกี่ยวกับสิทธิคนพิการของหน่วยปฏิบัติงานในพื้นที่ โดยเฉพาะอย่างยิ่งเรื่องการจัดสิ่งอำนวยความสะดวก การบริการและความช่วยเหลืออื่น ๆ ที่จำเป็นสำหรับคนพิการ\n 1.3 ให้สถาบันสร้างเสริมสุขภาพคนพิการ สถาบันวิจัยระบบสาธารณสุขและสถาบันการศึกษา\n ดำเนินการพัฒนาศักยภาพการวิจัยเพื่อสร้างความรู้ในการพัฒนาคุณภาพชีวิตคนพิการให้มากขึ้น\n1.4 ให้กระทรวงสาธารณสุขจัดทำแผนพัฒนาระบบบริการฟื้นฟูสมรรถภาพคนพิการทางการแพทย์เพื่อพัฒนาศักยภาพของสถานบริการในทุกสังกัด เร่งผลิตและกระจายกำลังคนให้เหมาะสม\n1.5 ให้กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ กระทรวงสาธารณสุข กระทรวงมหาดไทย กระทรวงศึกษาธิการ กระทรวงแรงงาน กระทรวงคมนาคม\n กระทรวงเทคโนโลยีสารสนเทศและการสื่อสาร กระทรวงการท่องเที่ยวและกีฬา พิจารณากำหนดตัวชี้วัดระดับกระทรวงที่เกี่ยวข้องกับการพัฒนาคุณภาพชีวิตคนพิการและติดตามและประเมินผลอย่างต่อเนื่องไม่น้อยกว่า 5 ปี\n1.6 ให้คณะกรรมการสุขภาพแห่งชาติพิจารณาแต่งตั้งคณะกรรมการสุขภาพคนพิการเพื่อทำหน้าที่เชื่อมประสานหน่วยงานและองค์กรภาคีเครือข่ายต่าง ๆ ในการจัดสมัชชาสุขภาพเฉพาะประเด็นว่าด้วยสุขภาพคนพิการ ขับเคลื่อนและติดตามการดำเนินงานตามมติสมัชชาสุขภาพแห่งชาติ ในประเด็นที่เกี่ยวข้องกับคนพิการสู่การปฏิบัติของฝ่ายต่าง ๆ อย่างเป็นระบบและต่อเนื่อง รวมถึงการสนับสนุนการสร้างและจัดการความรู้ที่เกี่ยวข้อง\n2. ให้คณะกรรมการสุขภาพแห่งชาติรับความเห็นของกระทรวงการคลังและกระทรวงศึกษาธิการเกี่ยวกับการให้คณะกรรมการพัฒนาระบบการเงินการคลังด้านสุขภาพแห่งชาติจัดทำข้อเสนอแนะต่อคณะรัฐมนตรี เพื่อให้หน่วยงานรัฐอื่น ๆ พัฒนาระบบการคลังเพื่อการดูแลสุขภาพคนพิการให้มีความเสมอภาค ควรดำเนินการเรื่องดังกล่าวตามช่องทางที่กำหนดไว้ในกฎหมาย และในการจัดบริการสุขภาพของคนพิการให้เป็นรูปธรรมอย่างทั่วถึง เสมอภาคและเท่าเทียมกันต้องอาศัยการมีส่วนร่วมของชุมชนที่เข้มแข็ง ผู้มีส่วนได้ส่วนเสีย องค์กรภาคเอกชนให้การสนับสนุนอย่างจริงจัง ซึ่งจะส่งผลให้เกิดความเป็นธรรมในการเข้าถึงบริการสุขภาพของคนพิการต่อไปในอนาคต ไปประกอบการพิจารณาต่อไป",

  {
   "id": "CR10012555-1",
   "date": "2555-01-10",
   "year": 2555,
   "title": "ความคืบหน้าการดำเนินการตามมติคณะรัฐมนตรี เรื่อง มติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 เรื่อง มาตรการทำให้สังคมไทยไร้แร่ใยหิน",
   "detail": "คณะรัฐมนตรีมีมติรับทราบตามที่กระทรวงการคลังรายงานความคืบหน้าการดำเนินการตามมติคณะรัฐมนตรี เรื่อง มติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 เรื่อง มาตรการทำให้สังคมไทยไร้แร่ใยหิน ซึ่งมีประเด็นความเห็นและผลการดำเนินการ ดังนี้\n 1. การเพิ่มอัตราภาษีนำเข้าแร่ใยหิน ในทางปฏิบัติมาตรการภาษีจะไม่สามารถสกัดกั้นการนำเข้าแร่ใยหินได้ แต่ควรใช้มาตรการที่ไม่ใช่ภาษีจะเกิดผลในทางปฏิบัติมากกว่า เพราะว่าแร่ใยหินตามพิกัดอัตราศุลกากรประเภท 25.24 (asbestos) ได้รับการยกเว้นอากรตามมาตรา 12 แห่งพระราชกำหนดพิกัดอัตราศุลกากร พ.ศ. 2530 และยกเว้นอากรตามความตกลงเขตการค้าเสรีในกรอบต่าง ๆ แล้ว ทั้งนี้ มติสมัชชาสุขภาพแห่งชาติได้ให้กระทรวงพาณิชย์ดำเนินการห้ามนำเข้าผลิตภัณฑ์ที่มีแร่ใยหินเป็นส่วนประกอบ ซึ่งเป็นมาตรการที่ไม่ใช่ภาษีอยู่ด้วยแล้ว ในส่วนของอัตราภาษีการนำเข้าของสารที่นำมาทดแทนที่ไม่เป็นอันตรายต่อสุขภาพ ส่วนใหญ่มีอัตราอากร ร้อยละ 0 - 5 ซึ่งถือว่าเป็นอัตราที่ค่อนข้างต่ำอยู่แล้ว\n 2. การส่งเสริมการวิจัยและพัฒนา ได้ดำเนินมาตรการภาษีเพื่อส่งเสริมการวิจัยและพัฒนา โดยให้หักเงินได้ของบริษัทหรือห้างหุ้นส่วนนิติบุคคลเป็นจำนวนร้อยละ 100 หรือหักค่าใช้จ่าย 2 เท่าสำหรับรายจ่ายที่ได้จ่ายเป็นค่าจ้างการทำวิจัยและพัฒนาเทคโนโลยีให้แก่หน่วยงานของรัฐและเอกชน ตามพระราชกฤษฎีกาออกตามความในประมวลรัษฎากรว่าด้วยการยกเว้นรัษฎากร (ฉบับที่ 297) พ.ศ. 2539\n 3. การตรวจสอบหาสาเหตุที่สินค้าที่ใช้วัตถุดิบอื่นเป็นส่วนประกอบแทนแร่ใยหินมีราคาสูงขึ้นเนื่องมาจากต้นทุนหรือการเพิ่มอัตราภาษี จากการตรวจสอบสินค้าที่เป็นวัตถุดิบที่ใช้ทดแทนแร่ใยหิน เช่น เส้นใยแก้วทอ เส้นใยเซรามิค เส้นใยยิปซั่ม เส้นใยคาร์บอน เส้นใยที่มีสภาพเป็นพลาสติก พบว่า ส่วนใหญ่วัตถุดิบดังกล่าวมีอัตราอากรร้อยละ 0 - 5 ซึ่งเป็นอัตราค่อนข้างต่ำ และยังมีเส้นใยที่ได้จากธรรมชาติซึ่งสามารถผลิตในประเทศได้ ดังนั้น อัตราภาษีขาเข้าจึงไม่น่าจะเป็นสาเหตุที่ทำให้สินค้าที่ใช้วัตถุดิบอื่นเป็นส่วนประกอบแทนแร่ใยหินมีราคาสูงขึ้น แต่สาเหตุที่ทำให้ต้นทุนสินค้าดังกล่าวมีราคาสูงขึ้นมีปัจจัยมาจากการวิจัยและพัฒนา ตลอดจนการปรับเปลี่ยนเทคโนโลยีทางการผลิตใหม่เป็นหลัก",

   "title": "3.6 มาตรการในการควบคุมปัจจัยเสี่ยงต่อสุขภาพด้านยาสูบ",
   "detail": "1. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 3 พ.ศ. 2553 เมื่อวันที่ 17 ธันวาคม 2553 มติ 6 มาตรการในการควบคุมปัจจัยเสี่ยงต่อสุขภาพด้านยาสูบ ตามมติคณะกรรมการสุขภาพแห่งชาติ ในการประชุมครั้งที่ 2/2554 เมื่อวันที่ 22 เมษายน 2554 ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติที่เกี่ยวข้องต่อไป ดังนี้\n1.1 ให้หน่วยงานราชการปฏิบัติตามแนวทางของกรอบอนุสัญญาว่าด้วยการควบคุมยาสูบขององค์การอนามัยโลก โดยเฉพาะมาตรา 5.3 การป้องกันการแทรกแซงนโยบายการควบคุมยาสูบของรัฐโดยอุตสาหกรรมยาสูบ โดยการกำหนดนโยบายหรือระเบียบภายในหน่วยงานเพื่อป้องกันการแทรกแซงดังกล่าว\n1.2 ให้กระทรวงการคลังดำเนินการปรับโครงสร้างภาษียาสูบ\nให้สอดคล้องกับบริบทในปัจจุบันเพื่อทำให้ราคาขายปลีกยาสูบโดยเฉลี่ยสูงขึ้น โดยขอให้พิจารณาจัดเก็บภาษีบุหรี่ซิกาแรตทั้งตามสภาพและตามราคาขายปลีก รวมทั้งให้ผู้ประกอบการอุตสาหกรรมยาสูบปิดแสตมป์ยาสูบบนซองบรรจุยาเส้นที่ทำจากใบยาสูบพันธุ์พื้นเมืองด้วย และดำเนินการทยอยปรับขึ้นภาษียาเส้นและยาสูบประเภทอื่นอย่างค่อยเป็นค่อยไป และห้ามธุรกิจยาสูบทำกิจกรรมภายใต้นโยบายความรับผิดชอบต่อสังคมของภาคธุรกิจ (Corporate Social Responsibility ; CSR)\n1.3 ให้สำนักงานหลักประกันสุขภาพแห่งชาติ สำนักงานประกันสังคม กรมบัญชีกลาง และกระทรวงสาธารณสุข ให้หลักประกันการเข้าถึงการบำบัดโรคติดบุหรี่ รวมถึงการเข้าถึงการรับยา สมุนไพร แพทย์แผนไทยหรือบริการแพทย์ทางเลือกที่จำเป็นต่อการบำบัดโรคติดบุหรี่ และสนับสนุนให้ชุมชนมีส่วนร่วมในงานเลิกบุหรี่ในชุมชน\n1.4 ให้กระทรวงเทคโนโลยีสารสนเทศและการสื่อสารปรับปรุงกฎหมายเพื่อห้ามการโฆษณา และการส่งเสริมการตลาดของผลิตภัณฑ์ยาสูบ และการประชาสัมพันธ์การให้ทุนอุปถัมภ์จากอุตสาหกรรมยาสูบทางสื่อคอมพิวเตอร์ทั้งจากภายในและต่างประเทศ และออกกฎหมายจัดสรรเวลาในการนำเสนอโทษของยาสูบในทุกประเภทสื่อในสัดส่วนที่เหมาะสม\n1.5 ให้กระทรวงวัฒนธรรม กรมประชาสัมพันธ์ และกระทรวงเทคโนโลยีสารสนเทศและการสื่อสารปรับปรุงกฎหมายเพื่อห้ามมีฉลากสูบบุหรี่ และการส่งเสริมการตลาดด้วยวิธีประชาสัมพันธ์ความรับผิดชอบต่อสังคมของภาคธุรกิจทางภาพยนตร์ โทรทัศน์และสื่อมวลชนต่าง ๆ และมีมาตรการส่งเสริมให้บุคคลสาธารณะที่มีชื่อเสียง เช่น ดารา นักร้อง เป็นแบบอย่างที่ดีแก่สาธารณชน โดยการไม่สูบบุหรี่ในที่สาธารณะ\n1.6 ให้กระทรวงการท่องเที่ยวและกีฬาและกระทรวงวัฒนธรรมควบคุมกำกับองค์กรและเครือข่ายไม่ให้รับการสนับสนุนใด ๆ จากบริษัทยาสูบทั้งภายในและต่างประเทศตามกฎหมาย\n1.7 ให้กระทรวงศึกษาธิการบรรจุเรื่องโรคที่เกี่ยวกับบุหรี่เข้าไปในหลักสูตรการเรียนการสอนและหน่วยงานที่มีสถานศึกษาในสังกัดทั้งภาครัฐและเอกชน ดำเนินการป้องกันและแก้ไขปัญหายาสูบในสถานศึกษา กำชับให้สถานศึกษาทุกแห่งติดป้ายห้ามสูบบุหรี่ในสถานศึกษาและห้ามสูบบุหรี่ในสถานศึกษาตามที่กฎหมายกำหนด ห้ามสูบบุหรี่ในขณะที่อยู่ในชุดของสถาบันหรือชุดนักศึกษา ให้บุคลากรทางการศึกษา เช่น ครู อาจารย์ นักการภารโรง ผู้นำทางศาสนา เป็นต้น เป็นแบบอย่างแก่นักเรียน นักศึกษา รวมทั้งสนับสนุนงบประมาณการผลิตสื่อนวัตกรรมเพื่อการเรียนรู้ด้านพิษภัยจากบุหรี่อย่างเป็นรูปธรรม และการวิจัยกิจกรรมการเรียนรู้เพื่อการปรับเปลี่ยนพฤติกรรมสุขภาพ\n1.8 ให้กระทรวงสาธารณสุขและคณะกรรมการควบคุมการบริโภคยาสูบแห่งชาติเป็นหน่วยงานหลักในการบูรณาการ โดยร่วมกับหน่วยงานที่เกี่ยวข้อง ได้แก่ กระทรวง มหาดไทย สำนักงานตำรวจแห่งชาติ กระทรวงการคลัง และองค์กรปกครองส่วนท้องถิ่น ในการบังคับใช้กฎหมายให้มีประสิทธิภาพ\n1.9 ให้องค์กรปกครองส่วนท้องถิ่นทุกระดับมีบทบาทร่วมในการควบคุมแหล่งผลิต วัตถุดิบในพื้นที่ และการใช้มาตรการทางกฎหมาย/ข้อบังคับอย่างจริงจังง\n2. ให้กระทรวงการคลังและสำนักงานตำรวจแห่งชาติให้ความสำคัญในการปราบปรามบุหรี่ต่างประเทศที่มีการลักลอบนำเข้ามาในประเทศอย่างผิดกฎหมาย ซึ่งทำให้ราคาบุหรี่ดังกล่าวต่ำกว่าบุหรี่ ที่มีจำหน่ายอยู่โดยทั่วไป และส่งผลให้เกิดการบริโภคเพิ่มมากขึ้น รวมทั้งกรณีการสำแดงราคานำเข้าของบุหรี่ต่างประเทศที่ต่ำกว่าปกติทำให้รัฐได้รับความเสียหาย",

  {

   "year": 2555,
   "title": "3.5 นโยบายสนับสนุนพื้นที่จัดการตนเองเพื่อสังคมสุขภาวะ",
   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติครั้งที่ 3 พ.ศ. 2553 เมื่อวันที่ 17 ธันวาคม 2553 มติ 5 นโยบายสนับสนุนพื้นที่จัดการตนเองเพื่อสังคมสุขภาวะ ตามมติคณะกรรมการสุขภาพแห่งชาติ ในการประชุมครั้งที่ 1/2554 เมื่อวันที่ 25 กุมภาพันธ์ 2554 ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ ดังนี้\n1.1 ขอให้คณะกรรมการสุขภาพแห่งชาติ เสนอคณะรัฐมนตรีเพื่อพิจารณาให้การสนับสนุนพื้นที่จัดการตนเองเพื่อสังคมสุขภาวะ เป็นนโยบายสำคัญ โดยมอบให้สถาบันพัฒนาองค์กรชุมชนร่วมกับสำนักงานคณะกรรมการการกระจายอำนาจให้แก่องค์กรปกครองส่วนท้องถิ่น และกรมส่งเสริมการปกครองส่วนท้องถิ่น เป็นแกนประสานการดำเนินงานโดยขอความร่วมมือจากสมาคมองค์การบริหารส่วนจังหวัดแห่งประเทศไทย สมาคมสันนิบาตเทศบาลแห่งประเทศไทย สมาคมองค์การบริหารส่วนตำบลแห่งประเทศไทย เพื่อให้เกิดคณะกรรมการที่เป็นกลไกการดำเนินการ ประกอบด้วยตัวแทนจากหน่วยงานต่าง ๆ ที่เกี่ยวข้องกับการจัดการชุมชนท้องถิ่น ทั้งภาครัฐ ภาคเอกชน ภาควิชาการ ภาคประชาชนโดยให้มีผู้แทนชุมชน ในสัดส่วน ไม่น้อยกว่าร้อยละ 60\n1.2 ขอให้สมาชิกสมัชชาสุขภาพแห่งชาติพิจารณากำหนดเรื่องพื้นที่จัดการตนเองเพื่อสังคมสุขภาวะเป็นหนึ่งในระเบียบวาระของสมัชชาสุขภาพเฉพาะพื้นที่ ทั้งนี้ เพื่อติดตาม ประเมินผลแผนยุทธศาสตร์การพัฒนาพื้นที่ทุกระดับภายในจังหวัด\n1.3 ขอให้องค์กรปกครองส่วนท้องถิ่นโดยเฉพาะองค์การบริหารส่วนจังหวัดเป็นองค์กรหลักในการสนับสนุนงบประมาณ และประสานการดำเนินงานร่วมกับสภาองค์กรชุมชน เครือข่ายองค์กรชุมชน เครือข่ายภาคประชาสังคม เครือข่ายสมัชชาสุขภาพจังหวัด เครือข่ายองค์กรปกครองส่วนท้องถิ่น และหน่วยงานที่เกี่ยวข้องภายในจังหวัดใช้เงื่อนไขตามรัฐธรรมนูญ \n มาตรา 66 มาตรา 78(3) มาตรา 87(1) และ (4) และมาตรา 163 ดำเนินการออกแบบและผลักดันให้ชุมชนท้องถิ่นมีบทบาทในการจัดการตนเองตามรูปแบบที่เหมาะสม\n2. ให้คณะกรรมการสุขภาพแห่งชาติรับความเห็นของกระทรวง มหาดไทยและสำนักงานปลัดสำนักนายกรัฐมนตรีเกี่ยวกับการตั้งงบประมาณสนับสนุนจากท้องถิ่น ไม่ควรกำหนดสัดส่วนไว้เป็นการเฉพาะ แต่ควรขึ้นอยู่กับศักยภาพ ความพร้อมและสถานการณ์คลังขององค์กรปกครองส่วนท้องถิ่น (อปท.) และเห็นควรระบุเจ้าภาพหลักในการประสานการจัดตั้งแกนประสานการดำเนินการเพื่อให้เกิดคณะกรรมการที่มีหน้าที่พัฒนากลไกการจัดการตนเองและพัฒนาศักยภาพชุมชนท้องถิ่นให้จัดการตนเองในทุกระดับ ส่วนการให้องค์การบริหารส่วนจังหวัด (อบจ.) เป็นหน่วยงานหลักในการสนับสนุนงบประมาณ ต้องขึ้นอยู่กับศักยภาพและสถานะทางการคลังของ อปท. เป็นหลัก ไปพิจารณาดำเนินการด้วย\n3. ให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติที่เกี่ยวข้องต่อไป ดังนี้\n3.1 การเข้าไปมีส่วนร่วมของหน่วยงานที่เกี่ยวข้องตามมติดังกล่าวให้ดำเนินการตามอำนาจหน้าที่ของหน่วยงานและอยู่ภายในกรอบของกฎหมายที่เกี่ยวข้อง\n3.2 กรณีเรื่องงบประมาณให้หน่วยงานที่เกี่ยวข้องดำเนินการตามหลักเกณฑ์และขั้นตอนที่กฎหมายหรือระเบียบกำหนด\n3.3 รัฐธรรมนูญแห่งราชอาณาจักรไทยบัญญัติให้รัฐต้องให้ความเป็นอิสระแก่ อปท. และให้ อปท. มีความเป็นอิสระในการกำหนดนโยบาย การบริหาร การเงินการคลัง และมีอำนาจหน้าที่ของตนเองโดยเฉพาะ ดังนั้น การดำเนินการตามมติดังกล่าวต้องไม่ขัดต่อความเป็นอิสระของ อปท.",

   "title": "มติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 4 พ.ศ. 2554",
   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 4 พ.ศ. 2554 รวม 5 มติ ตามมติคณะกรรมการสุขภาพแห่งชาติ ในการประชุมครั้งที่ 2/2555 เมื่อวันที่ 15 มีนาคม 2555 ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องตามอำนาจหน้าที่ต่อไป โดยให้อยู่ภายในกรอบของกฎหมายและมติคณะรัฐมนตรีที่เกี่ยวข้อง ดังนี้\n 1.1 มติ 2 การจัดการปัญหาการฆ่าตัวตาย (สุขใจ...ไม่คิดสั้น)\n 1.2 มติ 3 การจัดการภัยพิบัติธรรมชาติโดยชุมชนท้องถิ่นเป็นศูนย์กลาง\n 1.3 มติ 4 การบริหารจัดการทรัพยากรลุ่มน้ำขนาดเล็กอย่างยั่งยืนโดยกระบวนการมีส่วนร่วมของเครือข่ายและภาคีทุกภาคส่วน\n 1.5 มติ 5 การจัดการปัญหาโฆษณาที่ผิดกฎหมายของยา อาหาร และผลิตภัณฑ์สุขภาพทางวิทยุกระจายเสียง สื่อโทรทัศน์ อินเทอร์เน็ต\n 1.6 มติ 6 การเข้าถึงบริการอาชีวอนามัยเพื่อสุขภาพและความปลอดภัยของคนทำงานในภาคอุตสาหกรรมและบริการ\n 2. ให้สำนักงานคณะกรรมการสุขภาพแห่งชาติและหน่วยงานที่เกี่ยวข้องรับความเห็นของกระทรวงคมนาคม กระทรวงเทคโนโลยีสารสนเทศและการสื่อสาร กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม กระทรวงวัฒนธรรม กระทรวงวิทยาศาสตร์และเทคโนโลยี กระทรวงสาธารณสุข และสำนักงานสภาความมั่นคงแห่งชาติ รวมทั้งความเห็นของสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติเกี่ยวกับมติ 3 การจัดการภัยพิบัติธรรมชาติโดยชุมชนท้องถิ่นเป็นศูนย์กลาง ที่เห็นว่า การจัดตั้งกองทุนระดับชาติเพื่อบริหารจัดการความเสี่ยงจากภัยพิบัติ ควรพิจารณาขยายอำนาจหน้าที่ของกองทุนการประกันภัยพิบัติซึ่งมีอยู่แล้วให้ครอบคลุมการบริหารจัดการภัยพิบัติอย่างรอบด้านโดยไม่จำเป็นต้องให้มีการจัดตั้งกองทุนขึ้นใหม่ และเน้นการใช้กองทุนบริหารจัดการภัยพิบัติในระดับชาติแทนการจัดตั้งกองทุนในระดับท้องถิ่นเพื่อป้องกันปัญหาความไม่ยั่งยืนในเชิงการคลังของกองทุน โดยส่งเสริมให้ชุมชนมีบทบาทในการสนับสนุนการดำเนินงานของกองทุนให้เกิดประสิทธิภาพสูงสุด โดยเฉพาะอย่างยิ่งการเข้าร่วมประเมินและบริหารความเสี่ยงจากภัยพิบัติในพื้นที่ และการลำเลียงความช่วยเหลือไปสู่ผู้ประสบภัย ไปพิจารณาดำเนินการด้วย\n3. เห็นชอบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 4 พ.ศ. 2554 มติ 1 ความปลอดภัยทางอาหาร : การจัดการน้ำมันทอดซ้ำเสื่อมสภาพ ตามมติคณะกรรมการสุขภาพแห่งชาติ \nในการประชุมครั้งที่ 2/2554 เมื่อวันที่ 15 มีนาคม 2555 ตามที่สำนักงานคณะกรรมการสุขภาพแห่งชาติเสนอ และให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติที่เกี่ยวข้องตามอำนาจหน้าที่ต่อไป โดยให้อยู่ภายในกรอบของกฎหมายและมติคณะรัฐมนตรีที่เกี่ยวข้อง ทั้งนี้ ให้สำนักงานคณะกรรมการสุขภาพแห่งชาติและหน่วยงานที่เกี่ยวข้องรับความเห็นของกระทรวงเกษตรและสหกรณ์ กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม กระทรวงพาณิชย์ กระทรวงพลังงาน กระทรวงมหาดไทย กระทรวงวิทยาศาสตร์และเทคโนโลยี กระทรวงสาธารณสุข และกระทรวงอุตสาหกรรม เกี่ยวกับการให้หน่วยงานที่เกี่ยวข้องรวมถึงองค์กรปกครองส่วนท้องถิ่นร่วมกันขับเคลื่อนการดำเนินงานตามยุทธศาสตร์การจัดการน้ำมันทอดซ้ำที่เสื่อมสภาพ เพื่อให้ประชาชนและผู้ประกอบการอาหารทอดมีความรู้ ความเข้าใจ เกิดการเฝ้าระวังการใช้น้ำมันทอดซ้ำเสื่อมสภาพไปสู่การผลิตไบโอดีเซล เพื่อเป็นการสนับสนุนนโยบายพลังงานทดแทน รวมทั้งการให้ความรู้ ความเข้าใจ และความตระหนักเกี่ยวกับความเป็นพิษของการใช้น้ำมันทอดซ้ำ โดยการเผยแพร่ผ่านสื่อต่าง ๆ พร้อมทั้งพัฒนาวิธีวิเคราะห์สารประกอบโพลาร์ตามประกาศกระทรวงสาธารณสุข ฉบับที่283 พ.ศ. 2547 เรื่อง กำหนดปริมาณสารโพลาร์ในน้ำมันที่ใช้ทอดหรือประกอบอาหารเพื่อจำหน่าย ไปพิจารณาดำเนินการด้วย",

   "title": "5.4 การจัดการปัญหาหมอกควันที่มีผลกระทบต่อสุขภาพ",
   "detail": "1. รับทราบมติคณะกรรมการสุขภาพแห่งชาติ ในการประชุมครั้งที่ 1/2556 เมื่อวันที่ 25 มกราคม 2556 ตามที่รองนายกรัฐมนตรี (นายปลอดประสพ สุรัสวดี) ประธานกรรมการสุขภาพแห่งชาติเสนอ ดังนี้\n1.1 เห็นชอบต่อมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 5 เรื่อง การแก้ปัญหาหมอกควันที่มีผลกระทบต่อสุขภาพ โดยให้นำมาตรการป้องกันและแก้ไขปัญหามลพิษจากหมอกควันภาคเหนือตอนบนปี 2556 และการดำเนินการตามมาตรการป้องกันไฟป่าและหมอกควันประจำปี 2556 เพิ่มเติม ตามมติคณะรัฐมนตรีเมื่อวันที่ 8 มกราคม 2556 และ 21 มกราคม 2556 พิจารณาประกอบเพื่อให้สอดคล้องกัน และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการต่อไป\n1.2 รับทราบการประสานความร่วมมือด้านงบประมาณของรองนายกรัฐมนตรี (นายปลอดประสพ สุรัสวดี) และรัฐมนตรี ว่าการกระทรวงสาธารณสุข (นายประดิษฐ สินธวณรงค์) กับสำนักงานกองทุนสิ่งแวดล้อม และสำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ ในการจัดการปัญหาหมอกควันที่รัฐบาลกำลังดำเนินการอยู่ในขณะนี้\n2. ให้หน่วยงานที่เกี่ยวข้องรับมติคณะกรรมการสุขภาพแห่งชาติ ครั้งที่ 1/2556 เมื่อวันที่ 25 มกราคม 2556 ไปพิจารณาตามอำนาจหน้าที่ ภายใต้กฎหมาย ระเบียบ และมติคณะรัฐมนตรีที่เกี่ยวข้อง และให้รับความเห็นของหน่วยงานที่เกี่ยวข้องที่เห็นควรสร้างแนวกันไฟโดยปลูกพืชที่เหมาะสม เช่น พืชที่อุ้มน้ำมาก ๆ เพื่อลดความรุนแรงของไฟป่า การถ่ายทอดองค์ความรู้ทางด้านสุขภาพทั้งการป้องกันปัญหาทางสุขภาพที่เกิดจากหมอกควันและการรักษาเมื่อเกิดปัญหาทางสุขภาพที่เกิดจากหมอกควัน การสำรวจและวิจัยอย่างเร่งด่วนเพื่อให้ทราบข้อมูลสาเหตุปัญหาที่แท้จริงในระดับพื้นที่ และการประสานความร่วมมือกับท้องถิ่นซึ่งเป็นหน่วยงานที่รับผิดชอบดูแลระดับพื้นที่ที่ประสบปัญหาและมีความสามารถในการสร้างความมีส่วนร่วมและเป็นที่ยอมรับของชุมชนเพื่อให้เกิดการจัดการปัญหาไฟป่าและหมอกควันที่ยั่งยืน สำหรับมาตรการลดการเผาและการไม่ให้มีการเผา โดยเน้นการควบคุมปราบปรามอย่างเข้มงวด อาจกระทบต่อบางพื้นที่และป่าบางประเภทที่มีความจำเป็นต้องใช้วิธี “ชิงเผา” เพื่อกำจัดเชื้อเพลิงและป้องกันการลุกลามของไฟป่าอย่างรุนแรง จึงเห็นควรมุ่งเน้นการบริหารจัดการช่วงเวลาในการเผา และวิธีการใช้ไฟให้สอดคล้องกับระบบนิเวศน์ของแต่ละพื้นที่ รวมทั้งควรเร่งศึกษาวิจัยนวัตกรรมทางเทคโนโลยีทดแทนการเผาที่มีประสิทธิภาพมากกว่า เพื่อชักจูงให้เกษตรกรมีการปรับเปลี่ยนพฤติกรรมอย่างสมัครใจ ไปประกอบการพิจารณาต่อไปด้วย",

   "detail": "1. อนุมัติตามมติคณะกรรมการกลั่นกรองเรื่องเสนอคณะรัฐมนตรี คณะที่ 2 (ฝ่ายสังคมและกฎหมาย) ในการประชุมครั้งที่ 6/2556 เมื่อวันที่ 12 กันยายน 2556 ตามที่รองนายกรัฐมนตรี (นายพงศ์เทพ เทพกาญจนา) ประธานกรรมการกลั่นกรองเรื่องเสนอคณะรัฐมนตรี คณะที่ 2 (ฝ่ายสังคมและกฎหมาย) เสนอโดยคณะกรรมการกลั่นกรองฯ เห็นชอบมติสมัชชาสุขภาพแห่งชาติครั้งที่ 5 พ.ศ. 2555 เรื่อง การป้องกันและลดผลกระทบด้านสุขภาพจากโรงไฟฟ้าชีวมวล พร้อมทั้งแผนการขับเคลื่อนมติฯ และให้หน่วยงานที่เกี่ยวข้องรับไปดำเนินการตามมติฯ ที่เกี่ยวข้องต่อไป ยกเว้นประเด็นการห้ามใช้ถ่านหินเป็นเชื้อเพลิงในโรงไฟฟ้าชีวมวล [ตามมติสมัชชาสุขภาพแห่งชาติฯ ข้อ 1.4 (8)] และประเด็นการให้กระทรวงสาธารณสุขออกประกาศให้โรงไฟฟ้าชีวมวลเป็นกิจการที่เป็นอันตรายต่อสุขภาพ [ตามมติสมัชชาสุขภาพแห่งชาติฯ ข้อ 1.6 (2)] ให้ดำเนินการ ดังนี้\n 1.1 การห้ามใช้ถ่านหินเป็นเชื้อเพลิงในโรงไฟฟ้าชีวมวล [ตามมติฯ ข้อ 1.4 (8)] ให้กระทรวงพลังงานและสำนักงานคณะกรรมการกำกับกิจการพลังงานร่วมกับหน่วยงานที่เกี่ยวข้องกำหนดมาตรการในการลดและเลิกการใช้ถ่านหินเป็นเชื้อเพลิง ในโครงการโรงไฟฟ้าชีวมวลให้ชัดเจน โดยเฉพาะ ในโรงไฟฟ้าชีวมวลที่มีขนาดกำลังผลิตกระแสไฟฟ้ารวมต่ำกว่า 10 เมกะวัตต์\n 1.2 การให้กระทรวงสาธารณสุขออกประกาศให้โรงไฟฟ้าชีวมวลเป็นกิจการที่เป็นอันตรายต่อสุขภาพ [ตามมติฯ ข้อ 1.6 (2)] ให้กระทรวงสาธารณสุข (กรมอนามัย) ร่วมกับกระทรวงพลังงาน และสำนักงานคณะกรรมการกำกับกิจการพลังงานดำเนินการปรับปรุงการจัดทำประมวลหลักการปฏิบัติงาน (COP) โดยให้มีมาตรการควบคุมและป้องกันผลกระทบต่อสุขภาพอย่างครอบคลุมด้วย และให้กรมอนามัยในฐานะเลขานุการคณะกรรมการสาธารณสุขร่วมกับหน่วยงานที่เกี่ยวข้องศึกษาความเหมาะสมในการออกประกาศตามพระราชบัญญัติการสาธารณสุข พ.ศ. 2535 ให้การประกอบกิจการโรงไฟฟ้าชีวมวลเป็นกิจการที่เป็นอันตรายต่อสุขภาพต่อไป\n2. ยกเว้นประเด็นการห้ามใช้ถ่านหินเป็นเชื้อเพลิงในโรงไฟฟ้าชีวมวล [ตามมติสมัชชาสุขภาพแห่งชาติฯ ข้อ 1.4 (8)] และประเด็นการให้กระทรวงสาธารณสุขออกประกาศให้โรงไฟฟ้าชีวมวลเป็นกิจการที่เป็นอันตรายต่อสุขภาพ [ตามมติสมัชชาสุขภาพแห่งชาติฯ ข้อ 1.6 (2)] ให้กระทรวงพลังงานร่วมกับกระทรวงสาธารณสุขและหน่วยงานที่เกี่ยวข้องรับไปพิจารณาในประเด็นดังกล่าวว่าจะสามารถดำเนินการได้หรือไม่เพียงใด หรือมีแนวทางใดที่เหมาะสม และนำเสนอคณะรัฐมนตรีต่อไป",

   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 10 พ.ศ. 2560 และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติฯ ซึ่งประกอบด้วย 4 เรื่อง ได้แก่ \n (1) การส่งเสริมให้คนไทยทุกช่วงวัยมีกิจกรรมทางกายเพิ่มขึ้น \n (2) การพัฒนาพื้นที่เล่นสร้างเสริมสุขภาวะของเด็กปฐมวัยและวัยประถมศึกษา \n (3) ชุมชนเป็นศูนย์กลางในการป้องกันและแก้ไขปัญหายาเสพติด \n (4) การจัดการขยะมูลฝอยในชุมชนแบบมีส่วนร่วมอย่างยั่งยืน โดยมติฯ ทั้ง 4 เรื่องดังกล่าวได้ขอให้ทุกภาคส่วนในสังคม ได้แก่ รัฐบาล หน่วยราชการ องค์กรปกครองส่วนท้องถิ่น หน่วยงาน องค์กรภาคีต่าง ๆ ทั้งธุรกิจเอกชน องค์กรเอกชน ประชาสังคม องค์กรวิชาชีพ สถาบันวิชาการ และสมาชิกสมัชชาสุขภาพแห่งชาติ ตลอดจนประชาชนทุกภาคส่วนร่วมกันขับเคลื่อนให้เกิดการปฏิบัติอย่างเป็นรูปธรรม รวมทั้งให้มีการติดตามผลการดำเนินการมาเสนอต่อสมัชชาสุขภาพแห่งชาติในคราวต่อ ๆ ไป และเสนอต่อสาธารณะต่อไปด้วย ตามที่รองนายกรัฐมนตรี (พลเอก ฉัตรชัย สาริกัลยะ) ประธานกรรมการสุขภาพแห่งชาติเสนอ\n 2. ให้รับความเห็นของกระทรวงวัฒนธรรม กระทรวงศึกษาธิการ สำนักงบประมาณ และสำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ เช่น เห็นควรให้หน่วยงานทุกภาคส่วนสนับสนุนมติดังกล่าวเพื่อสานพลังให้เกิดการขับเคลื่อนสู่รูปธรรมและประชาชนมีสุขภาพดีถ้วนหน้าอย่างยั่งยืน และเห็นควรให้สร้างความรู้ความเข้าใจถึงความหมายของกิจกรรมทางกายและพื้นที่เล่นแก่ประชาชนอย่างทั่วถึง เป็นต้น ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องต่อไปด้วย",

   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 11 พ.ศ. 2561 จำนวน 4 มติ ได้แก่ \n มติ 1 การร่วมสร้างสรรค์พื้นที่สาธารณะในเขตเมืองเพื่อสุขภาวะสู่การพัฒนาอย่างยั่งยืน \n มติ 2 ความรับผิดชอบร่วมทางสังคมเกี่ยวกับอีสปอร์ตต่อสุขภาวะเด็ก\n มติ 3 ความรอบรู้ด้านสุขภาพเพื่อป้องกันและแก้ไขปัญหาโรคไม่ติดต่อ \n มติ 4 การคุ้มครองผู้บริโภคด้านบริการทันตกรรม และมอบหมายหน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติดังกล่าวต่อไป \n ตามที่รองนายกรัฐมนตรี (นายอนุทิน ชาญวีรกูล) ประธานกรรมการสุขภาพแห่งชาติเสนอ รวมทั้งให้หน่วยงานที่เกี่ยวข้องรับความเห็นของหน่วยงานต่าง ๆ ในประเด็นที่เกี่ยวข้อง เช่น \n มติ 1 ควรมีกลไกในการบูรณาการการใช้ทรัพยากร พื้นที่ และการจัดกิจกรรมที่หลากหลาย ยืดหยุ่น และเหมาะสมกับทุกช่วงวัย\n มติ 2 ควรพิจารณาถึงมาตรการหรือแนวทางในการปกป้องคุ้มครองเด็กและเยาวชนในการเข้าถึง อีสปอร์ตและวีดิโอเกมออนไลน์อย่างเหมาะสม \n มติ 3 ควรให้ความสำคัญกับการใช้ประโยชน์จากเทคโนโลยีดิจิทัลในการสร้างความรอบรู้ด้านสุขภาวะ (Digital Health Literacy) แก่ประชาชน \n มติ 4 ควรมีการกำหนดราคากลางและควบคุมราคาค่าบริการของหน่วยบริการ ทุกแห่งไม่ให้สูงกว่าราคากลาง เป็นต้น ไปพิจารณาดำเนินการต่อไปด้วย\n 2. สำหรับค่าใช้จ่ายในปีงบประมาณ พ.ศ. 2563 เห็นควรให้หน่วยงานที่เกี่ยวข้องพิจารณาปรับแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ ประจำปีงบประมาณ พ.ศ. 2563 มาดำเนินการ ส่วนค่าใช้จ่ายในปีต่อ ๆ ไป เห็นควรให้จัดทำแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณเพื่อเสนอขอตั้งงบประมาณรายจ่ายประจำปีตามความจำเป็นและเหมาะสมต่อไป \n ตามความเห็นของสำนักงบประมาณ",

   "title": "มติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 12 พ.ศ. 2562",
   "detail": "1. รับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 12 พ.ศ. 2562 ซึ่งประกอบด้วย 4 มติ ได้แก่\n มติ 1 ทบทวนมติสมัชชาสุขภาพแห่งชาติ มาตรการทำให้สังคมไทยไร้ใยหิน \n มติ 2 วิถีเพศภาวะ : เสริมพลังสุขภาวะครอบครัว \n มติ 3 รวมพลังชุมชนต้านมะเร็ง \n มติ 4 การจัดการเชิงระบบสู่ประเทศใช้ยาอย่างสมเหตุผล โดยชุมชนเป็นศูนย์กลาง และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติที่เกี่ยวข้องต่อไป ตามที่คณะกรรมการสุขภาพแห่งชาติเสนอ รวมทั้งให้หน่วยงานที่เกี่ยวข้องรับความเห็นของหน่วยงานต่าง ๆ ในประเด็นที่เกี่ยวข้อง เช่น \n (1) กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคมมีศูนย์ต่อต้านข่าวปลอม (Anti-Fake New Center) เป็นช่องทางในการให้ข้อมูลที่ถูกต้องแก่ประชาชนและสร้างความรู้ความเข้าใจหรือแนะนำแหล่งข้อมูลที่ถูกต้องในเรื่องโรคภัยและสุขภาพให้แก่สังคม \n (2) กระทรวงวัฒนธรรมเห็นว่า ในมติ 2 วิถีเพศภาวะ: เสริมพลังสุขภาวะครอบครัว ควรมีแนวทางการสร้างการรับรู้และความเข้าใจของเด็กและเยาวชนในเรื่องวิถีเพศภาวะอย่างเหมาะสม รวมถึงการสร้างการยอมรับและเข้าใจซึ่งกันและกันระหว่างสมาชิกในระดับครอบครัวและชุมชน \n (3) สำนักนายกรัฐมนตรีเห็นว่า กรมบัญชีกลางในฐานะเลขานุการของคณะกรรมการนโยบายการจัดซื้อจัดจ้างและบริหารพัสดุภาครัฐ ควรพิจารณากำหนดรายละเอียดและแนวทางปฏิบัติให้หน่วยงานภาครัฐใช้วัสดุและผลิตภัณฑ์ปลอดแร่ใยหินต่อไป เป็นต้น ไปพิจารณาดำเนินการต่อไปด้วย\n 2. สำหรับค่าใช้จ่ายในปีงบประมาณ พ.ศ. 2564 เห็นควรให้หน่วยรับงบประมาณที่เกี่ยวข้องพิจารณาปรับแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ ประจำปีงบประมาณ พ.ศ. 2564 มาดำเนินการ ส่วนค่าใช้จ่ายในปีต่อ ๆ ไป เห็นควรให้จัดทำแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ เพื่อเสนอขอตั้งงบประมาณรายจ่ายประจำปีตามความจำเป็นและเหมาะสมตามขั้นตอนต่อไป ตามความเห็นของสำนักงบประมาณ NHA 12",

   "detail": "คณะรัฐมนตรีมีมติรับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 13 พ.ศ. 2563 ใน 2 มติ ได้แก่ \n (1) ความมั่นคงทางอาหารในภาวะวิกฤต เช่น การดำเนินการเรื่อง “สิทธิในอาหาร” การจัดทำนโยบายและแผนปฏิบัติการระดับชาติ และการพัฒนาระบบอาหารให้พร้อมรับภาวะวิกฤต เป็นต้น \n (2) การบริหารจัดการวิกฤตสุขภาพแบบมีส่วนร่วม กรณีโรคระบาดใหญ่ เช่น การบูรณาการด้านการบริหารจัดการ การบริหารจัดการด้านการสื่อสารและระบบข้อมูล และการจัดให้มีกำลังคนและโครงสร้างพื้นฐานทางสาธารณสุขที่จำเป็นให้เพียงพอ เป็นต้น และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติฯ ในส่วนที่เกี่ยวข้องให้เหมาะสม ถูกต้อง เป็นไปตามกฎหมาย ระเบียบ หลักเกณฑ์ และมติคณะรัฐมนตรีที่เกี่ยวข้องต่อไป ทั้งนี้ ให้หน่วยงานที่เกี่ยวข้องรับความเห็นของหน่วยงานต่าง ๆ เช่น เห็นควรให้มีหน่วยงานกลางประสานงานและติดตามผลการดำเนินงาน เห็นควรให้กระทรวงสาธารณสุขเร่งดำเนินการตามแผนปฏิรูปกำลังคนและภารกิจบริการสุขภาพของกระทรวงสาธารณสุข (พ.ศ. 2561-2570) และหากมีภาระค่าใช้จ่ายในปีงบประมาณ พ.ศ. 2564 เห็นควรให้หน่วยรับงบประมาณที่เกี่ยวข้องพิจารณาปรับแผนการปฏิบัติงานและแผนการใช้จ่ายประจำปีงบประมาณ พ.ศ. 2564 มาดำเนินการในโอกาสแรก สำหรับค่าใช้จ่ายในปีต่อ ๆ ไป ให้จัดทำแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณเสนอตามขั้นตอนต่อไป เป็นต้น ไปพิจารณาประกอบการดำเนินการในส่วนที่เกี่ยวข้องด้วย",

   "detail": "คณะรัฐมนตรีมีมติรับทราบมติสมัชชาสุขภาพแห่งชาติ ครั้งที่ 14 พ.ศ. 2564 ประกอบด้วย 3 มิติ ได้แก่ มิติ 1 การสร้างเสริมสุขภาวะสิ่งแวดล้อมที่ยั่งยืนในวิกฤตโรคติดเชื้อไวรัสโคโรนา 2019 (โควิด-19) มติ 2 การคุ้มครองการเข้าถึงบริการสุขภาพของกลุ่มประชากรเฉพาะในภาวะวิกฤตอย่างเป็นธรรม มิติ 3 การจัดการสื่อสารอย่างมีส่วนร่วมในวิกฤติสุขภาพ และมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามมติฯ ที่เกี่ยวข้อง ตามที่คณะกรรมการสุขภาพแห่งชาติเสนอ ทั้งนี้ ให้กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม กระทรวงสาธารณสุข สำนักงานปลัดสำนักนายกรัฐมนตรี (กรมประชาสัมพันธ์) คณะกรรมการสุขภาพแห่งชาติ และหน่วยงานที่เกี่ยวข้องรับข้อเสนอแนะของกระทรวงศึกษาธิการ ข้อสังเกตของสำนักงานสภาพัฒนาการเศรษฐกิจและสังคมแห่งชาติ และความเห็นของกระทรวงคมนาคมและสำนักงบประมาณ เช่น การจัดการสิ่งแวดล้อมในทุกมิติ ควรมุ่งเน้นให้เกิดเครือข่ายพลเมืองตื่นรู้และการมีส่วนร่วมของทุกภาคส่วนในการบูรณาการขับเคลื่อนไปสู่เป้าหมายการพัฒนาที่ยั่งยืน ปรับห้วงเวลาของแผนปฏิบัติการฯ จาก พ.ศ. 2564-2569 เป็น พ.ศ. 2564-2570 เพื่อให้สอดคล้องกับที่คณะรัฐมนตรีได้มีมติเห็นชอบแผนปฏิบัติการฯ ไปแล้วเมื่อวันที่ 8 กุมภาพันธ์ 2565 และให้ถือปฏิบัติตามกฎหมาย ระเบียบ มติคณะรัฐมนตรีที่เกี่ยวข้อง และหลักธรรมาภิบาลอย่างเคร่งครัด รวมทั้งให้หน่วยรับงบประมาณที่เกี่ยวข้องพิจารณาปรับแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ โอนเงินจัดสรรหรือเปลี่ยนแปลงเงินจัดสรร ประจำปีงบประมาณ พ.ศ. 2565 แล้วแต่กรณี ไปพิจารณาดำเนินการในส่วนที่เกี่ยวข้องต่อไปด้วย",

  {

   "date": "2565-12-27",
   "year": 2565,
   "title": "มติสมัชชาสุขภาพเฉพาะประเด็น การปกป้องเด็กและเยาวชนจากบุหรี่ไฟฟ้า",
   "detail": "คณะรัฐมนตรี (ครม.) มติรับทราบมติสมัชชาสุขภาพเฉพาะประเด็นการปกป้องเด็กและเยาวชนจากบุหรี่ไฟฟ้า และเห็นชอบมาตรการการป้องกันและควบคุมการแพร่ระบาดบุหรี่ไฟฟ้าในประเทศไทย 5 มาตรการ ตามที่คณะกรรมการสุขภาพแห่งชาติ (คสช.) เสนอ พร้อมมอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามภาระหน้าที่ที่เกี่ยวข้องต่อไป\n มาตรการการป้องกันและควบคุมการแพร่ระบาดบุหรี่ไฟฟ้าในประเทศไทย 5 มาตรการ ประกอบด้วย\n มาตรการที่ 1 พัฒนาและจัดการองค์ความรู้ เช่น กำหนดให้สถานศึกษาเป็นสถานศึกษาปลอดบุหรี่และบุหรี่ไฟฟ้า บูรณาการการเรียนการสอนและกิจกรรมพัฒนาผู้เรียนให้รู้เท่าทันพิษภัยและกลยุทธ์ทางตลาดของบุหรี่และบุหรี่ไฟฟ้าให้สอดรับกับระดับการเรียนรู้ของแต่ละช่วงวัย\n มาตรการที่ 2 สร้างการรับรู้ภยันอันตรายและการเสพติดของบุหรี่ไฟฟ้าแก่เด็ก เยาวชน และสาธารณชน เช่น สร้างความตระหนักรู้ถึงภยันอันตรายและการเสพติดของบุหรี่ และบุหรี่ไฟฟ้า หรือผลิตภัณฑ์ที่มีนิโคตินรูปแบบใหม่ และดำเนินการผลิต เผยแพร่ และประชาสัมพันธ์เกี่ยวกับภยันตรายและการเสพติดของบุหรี่และบุหรี่ไฟฟ้าหรือผลิตภัณฑ์ที่มีนิโคตินรูปแบบใหม่ ๆ ที่ไม่ใช่ผลิตภัณฑ์ทางการแพทย์\n มาตรการที่ 3 เฝ้าระวังและบังคับใช้กฎหมายควบคุมบุหรี่ไฟฟ้า เช่น กำหนดมาตรการทางกฏหมาย ตลอดจนระเบียบต่าง ๆ เพื่อกำกับดูแลการประกอบกิจการกระจายเสียง กิจการโทรทัศน์และกิจการโทรคมนาคม มิให้มีการเผยแพร่และนำเสนอประเด็นที่บิดเบือนเกี่ยวกับบุหรี่หรือบุหรี่ไฟฟ้า จัดทำคู่มือหรือแนวทางในการผลิตสื่อภาพยนตร์ วิดีทัศน์ หรือสื่ออื่นใดที่หลีกเลี่ยงให้มีบุหรี่และบุหรี่ไฟฟ้า รวมถึงผลิตภัณฑ์ยาสูบอยู่ในองค์ประกอบส่วนหนึ่งของฉาก ตลอดจนสำรวจความชุกของการใช้บุหรี่ไฟฟ้า อย่างน้อยทุก ๆ 2 ปี\n มาตรการที่ 4 พัฒนาศักยภาพภาคีเครือข่ายเพื่อสนับสนุนมาตรการป้องกัน ควบคุมบุหรี่ไฟฟ้า เช่น จัดทำแนวปฏิบัติการขนส่งโดยระบุให้บุหรี่ไฟฟ้าเป็นสินค้าต้องห้ามส่ง เพื่อป้องกันการเข้าถึงบุหรี่ไฟฟ้าในช่องทางการซื้อขายโดยเฉพาะทางออนไลน์ รวมถึงให้หน่วยงานภาครัฐ กำหนดนโยบายเพื่อส่งเสริมให้องค์กรปกครองส่วนท้องถิ่นและชุมชนดำเนินกิจกรรมในการสร้างความตระหนักรู้และร่วมปกป้องเด็กและเยาวชนจากการเสพติดบุหรี่ไฟฟ้า\nมาตรการที่ 5 ยืนยันนโยบายและมาตรการป้องกัน และปราบปรามการแพร่ระบาดบุหรี่ไฟฟ้า โดยที่คำนึงถึงพันธสัญญาที่ประเทศไทยได้ร่วมเป็นสมาชิกและต้องดำเนินการตามกรอบอนุสัญญาว่าด้วยการควบคุมยาสูบขององค์การอนามัยโลก อนุสัญญาว่าด้วยสิทธิเด็ก และเป้าหมายการพัฒนาอย่างยั่งยืน โดยองค์กรสหประชาชาติ และพระราชบัญญัติคุ้มครองเด็ก พ.ศ. 2546\nทั้งนี้ คณะรัฐมนตรียังได้มอบหมายให้หน่วยงานที่เกี่ยวข้องรับไปพิจารณาดำเนินการตามภาระหน้าที่ที่เกี่ยวข้องต่อไป",

    "To find key mechanism": ["ต้องหากลไกหลัก", "To find key mechanism"],
    "End-up":                ["ยุติการขับเคลื่อน", "Ended"]
  };

  var MONTHS = {
    th: ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."],
    en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

  var lang = "th";

  function idx() { return lang === "en" ? 1 : 0; }

  return {
    get lang() { return lang; },

    /** UI string by key. */

    months: function () { return MONTHS[lang]; },

    num:    function (v) { return Number(v || 0).toLocaleString(lang === "en" ? "en-US" : "th-TH"); }
  };
})();
